# Source overlays shared by platform image builds. Moving refs are resolved once
# per workflow; native components owned by a vendor base remain digest-pinned.
sources:
  megatron_lm_fl:
    repository: https://github.com/flagos-ai/Megatron-LM-FL.git
    policy: branch
    branch: main
  transformer_engine_fl:
    repository: https://github.com/flagos-ai/TransformerEngine-FL.git
    policy: branch
    branch: main
  vllm_plugin_fl:
    repository: https://github.com/flagos-ai/vllm-plugin-FL.git
    policy: branch
    branch: main
  flaggems:
    repository: https://github.com/flagos-ai/FlagGems.git
    policy: latest_release
