name: SBOM Generation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Mondays
  workflow_dispatch:

jobs:
  sbom-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM from requirements files
        run: |
          # Create a temporary directory for our requirements files
          mkdir -p temp_reqs
          
          # Copy the specific requirements files we want to scan
          cp requirements/requirements-base.txt temp_reqs/
          cp requirements/requirements-common.txt temp_reqs/
          
          # Generate SBOM specifically from these requirements files
          syft dir:temp_reqs -o spdx-json > sbom-spdx.json
          syft dir:temp_reqs -o cyclonedx-json > sbom-cyclonedx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v3
        with:
          name: sbom-files
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json

      - name: Scan for vulnerabilities (optional)
        run: |
          # Install Grype for vulnerability scanning
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:sbom-spdx.json --fail-on high