name: Common Unit Tests

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: Platform name (e.g., cuda, default)
      device:
        required: true
        type: string
        description: Device type (e.g., a100, a800, h100, generic)
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      pkg_mgr:
        required: false
        type: string
        description: Package manager (pip, uv, conda). Default uv.
        default: "uv"
      env_name:
        required: false
        type: string
        description: Conda environment name (for conda only)
        default: ""
      env_path:
        required: false
        type: string
        description: Environment path (venv path for uv, conda installation path for conda)
        default: "/opt/venv"
      megatron_cache_key:
        required: false
        type: string
        default: ''
      megatron_artifact_available:
        required: false
        type: string
        default: 'false'
        description: Megatron-LM-FL cache key from prepare_dependencies
      te_fl_cache_key:
        required: false
        type: string
        default: ''
        description: TE-FL cache key from prepare_dependencies
      te_fl_artifact_available:
        required: false
        type: string
        default: 'false'
      megatron_lm_fl_enabled:
        required: false
        type: string
        default: 'false'
        description: Whether Megatron-LM-FL dependency is enabled
      te_fl_enabled:
        required: false
        type: string
        default: 'false'
        description: Whether TE-FL dependency is enabled
      megatron_runtime_environment:
        required: false
        type: string
        default: '{}'
        description: Megatron-LM-FL runtime environment variables (JSON)
      te_fl_runtime_environment:
        required: false
        type: string
        default: '{}'
        description: TE-FL runtime environment variables (JSON)
      te_fl_install_pip_args:
        required: false
        type: string
        default: '[]'
        description: TE-FL pip install arguments (JSON array)
      te_fl_runtime_pip_packages:
        required: false
        type: string
        default: '[]'
        description: TE-FL runtime pip packages (JSON array)

jobs:
  unit_test:
    defaults:
      run:
        shell: bash
    env:
      PROJECT_ROOT: ${{ github.workspace }}/FlagScale
      COVERAGE_REPORT_DIR: /tmp/coverage-report
    runs-on: ${{ fromJson(inputs.runs_on) }}
    name: unit-${{ inputs.device }}
    container:
      image: ${{ inputs.image }}
      ports:
        - 80
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}
    steps:
      - name: Checkout code (attempt 1)
        id: checkout_attempt_1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: FlagScale
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Checkout code (attempt 2)
        if: steps.checkout_attempt_1.outcome == 'failure'
        id: checkout_attempt_2
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: FlagScale
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Checkout code (attempt 3)
        if: steps.checkout_attempt_2.outcome == 'failure'
        id: checkout_attempt_3
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: FlagScale
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Set safe directory
        run: |
          git config --global --add safe.directory $PROJECT_ROOT

      - name: Check environment info
        run: cd $PROJECT_ROOT && bash ./tests/test_utils/runners/check_env.sh

      - name: Reset prepared runtime directories
        if: inputs.megatron_lm_fl_enabled == 'true' || inputs.te_fl_enabled == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf megatron-lm-fl-install te-fl-wheel

      - name: Restore Megatron-LM-FL cache
        if: inputs.megatron_lm_fl_enabled == 'true' && inputs.megatron_cache_key != ''
        id: megatron_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: megatron-lm-fl-install
          key: ${{ inputs.megatron_cache_key }}
          fail-on-cache-miss: false

      - name: Restore TE-FL cache
        if: inputs.te_fl_enabled == 'true' && inputs.te_fl_cache_key != ''
        id: te_fl_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: te-fl-wheel
          key: ${{ inputs.te_fl_cache_key }}
          fail-on-cache-miss: false

      - name: Restore prepared Megatron artifact
        if: inputs.megatron_lm_fl_enabled == 'true' && inputs.megatron_cache_key != '' && steps.megatron_cache_restore.outputs.cache-hit != 'true' && inputs.megatron_artifact_available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: prepared-megatron-${{ inputs.platform }}-${{ github.run_id }}
          path: megatron-lm-fl-install

      - name: Restore prepared TE-FL artifact
        if: inputs.te_fl_enabled == 'true' && inputs.te_fl_cache_key != '' && steps.te_fl_cache_restore.outputs.cache-hit != 'true' && inputs.te_fl_artifact_available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: prepared-te-fl-${{ inputs.platform }}-${{ github.run_id }}
          path: te-fl-wheel

      - name: Validate prepared training runtime
        if: inputs.megatron_lm_fl_enabled == 'true' || inputs.te_fl_enabled == 'true'
        run: |
          set -euo pipefail
          if [ "${{ inputs.megatron_lm_fl_enabled }}" = "true" ] && [ ! -f megatron-lm-fl-install/megatron/core/__init__.py ]; then
            echo "::error::Prepared Megatron-LM-FL runtime is missing megatron/core/__init__.py" >&2
            exit 1
          fi
          if [ "${{ inputs.te_fl_enabled }}" = "true" ]; then
            mapfile -t te_fl_wheels < <(
              find te-fl-wheel -maxdepth 1 -type f -name 'transformer_engine*.whl' -print 2>/dev/null | sort
            )
            if [ "${#te_fl_wheels[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one TE-FL wheel, found ${#te_fl_wheels[@]}" >&2
              printf '  %s\n' "${te_fl_wheels[@]}" >&2
              exit 1
            fi
          fi

      - name: Install prepared training runtime
        if: inputs.megatron_lm_fl_enabled == 'true' || inputs.te_fl_enabled == 'true'
        run: |
          set -euo pipefail
          cd $PROJECT_ROOT

          export MEGATRON_LM_FL_ENABLED='${{ inputs.megatron_lm_fl_enabled }}'
          export MEGATRON_CACHE_KEY='${{ inputs.megatron_cache_key }}'
          export MEGATRON_RUNTIME_ENVIRONMENT='${{ inputs.megatron_runtime_environment }}'
          export TE_FL_ENABLED='${{ inputs.te_fl_enabled }}'
          export TE_FL_CACHE_KEY='${{ inputs.te_fl_cache_key }}'
          export TE_FL_RUNTIME_ENVIRONMENT='${{ inputs.te_fl_runtime_environment }}'
          export TE_FL_INSTALL_PIP_ARGS='${{ inputs.te_fl_install_pip_args }}'
          export TE_FL_RUNTIME_PIP_PACKAGES='${{ inputs.te_fl_runtime_pip_packages }}'
          export CI_RUNTIME_PKG_MGR='${{ inputs.pkg_mgr }}'
          export CI_RUNTIME_ENV_NAME='${{ inputs.env_name }}'
          export CI_RUNTIME_ENV_PATH='${{ inputs.env_path }}'
          bash .github/scripts/install_training_runtime.sh

      - name: Setup unit test environment
        run: |
          set -euo pipefail
          cd $PROJECT_ROOT

          bash ./tests/test_utils/runners/setup_training_test_env.sh \
            --platform '${{ inputs.platform }}' \
            --pkg-mgr '${{ inputs.pkg_mgr }}' \
            --env-name '${{ inputs.env_name }}' \
            --env-path '${{ inputs.env_path }}' \
            --install-common-deps \
            --copy-data
        timeout-minutes: 30

      - name: Run unit tests
        id: unit_test
        run: |
          set -euo pipefail
          cd $PROJECT_ROOT

          PKG_MGR='${{ inputs.pkg_mgr }}'
          ENV_NAME='${{ inputs.env_name }}'
          ENV_PATH='${{ inputs.env_path }}'

          source ./tools/install/utils/pyenv_utils.sh
          case "$PKG_MGR" in
            conda)
              if [ -n "$ENV_NAME" ]; then
                activate_conda "$ENV_NAME" "$ENV_PATH" || echo "Conda activation failed"
              fi
              ;;
            uv)
              if [ -n "$ENV_PATH" ] && [ -d "$ENV_PATH" ]; then
                activate_uv_env "$ENV_PATH" || echo "UV activation failed"
              fi
              ;;
            pip)
              echo "Running tests with pip/system Python"
              ;;
            *)
              echo "Unsupported package manager: $PKG_MGR"
              exit 1
              ;;
          esac

          echo "Python location: ${CI_PYTHON_BIN:-python3}"
          echo "Python version: $(${CI_PYTHON_BIN:-python3} --version)"

          set +e
          # PYTHONPATH is set by run_unit_tests.sh with correct priority
          # Do NOT override it here to prevent path order conflicts
          bash ./tests/test_utils/runners/run_unit_tests.sh \
            --platform '${{ inputs.platform }}' \
            --device '${{ inputs.device }}' \
            --coverage-dir "$COVERAGE_REPORT_DIR"
          exit_code=$?
          set -e

          if [ $exit_code -eq 0 ]; then
            echo "Unit tests passed for ${{ inputs.platform }}/${{ inputs.device }}"
          else
            echo "Unit tests failed for ${{ inputs.platform }}/${{ inputs.device }} (exit code: $exit_code)"
          fi

          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code
        timeout-minutes: 30

      - name: Upload coverage report
        if: steps.unit_test.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.platform }}-${{ inputs.device }}
          path: ${{ env.COVERAGE_REPORT_DIR }}/coverage.json
          retention-days: 7

      - name: Upload coverage report to FlagCICD
        if: steps.unit_test.outcome == 'success'
        continue-on-error: true
        uses: flagos-ai/FlagOps/actions/post-pytest-report@v2.0.4
        env:
          NO_PROXY: "flagcicd.flagos.net"
        with:
          user_id: '000000000000000000'
          backend_url: 'http://flagcicd-inner.flagos.net:8000/metrics/'
          report_path: '${{ env.COVERAGE_REPORT_DIR }}/coverage.json'
          fail_on_error: 'false'
          runner_set_name: ${{ fromJson(inputs.runs_on)[0] }}
