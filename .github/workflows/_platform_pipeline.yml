# Reusable per-platform pipeline for FlagScale CI:
#   prepare_dependencies → all_tests_common.
# Called from ci.yml with a platform matrix so each platform runs independently.

name: Platform Pipeline

on:
  workflow_call:
    secrets:
      FLAGCICD_API_TOKEN:
        required: false
        description: Optional FlagCICD report upload token; unavailable in fork PRs
    inputs:
      test_plan:
        type: string
        required: false
        default: ''
        description: Validated FlagScale test plan; empty preserves legacy full execution
      source_repository:
        type: string
        required: false
        default: ''
        description: Explicit source repository for PR comment requests
      source_sha:
        type: string
        required: false
        default: ''
        description: Immutable source commit for PR comment requests
      platform:
        required: true
        type: string
        description: Platform identifier (must match a .github/configs/*.yml stem)

jobs:
  prepare:
    name: prepare / ${{ inputs.platform }}
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
      platform: ${{ inputs.platform }}

  test:
    name: test / ${{ inputs.platform }}
    needs: prepare
    uses: ./.github/workflows/all_tests_common.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
      platform: ${{ inputs.platform }}
      test_plan: ${{ inputs.test_plan }}
      megatron_cache_key: ${{ needs.prepare.outputs.megatron_cache_key }}
      megatron_artifact_available: ${{ needs.prepare.outputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ needs.prepare.outputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ needs.prepare.outputs.te_fl_artifact_available }}
