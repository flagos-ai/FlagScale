name: Requested CI
run-name: 'Requested CI: PR #${{ inputs.pr_number }} / ${{ inputs.platform }} / ${{ inputs.head_sha }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number in this repository
        type: string
        required: true
      head_sha:
        description: Exact current PR head SHA (40 hex characters)
        type: string
        required: true
      platform:
        description: Configured platform name or all
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

# A platform supplement cannot cancel the ordinary required CI run.
concurrency:
  group: requested-ci-${{ inputs.pr_number }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Validate requested PR commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_repository: ${{ steps.pr.outputs.repository }}
      source_sha: ${{ steps.pr.outputs.sha }}
      platforms: ${{ steps.matrix.outputs.platforms }}
      plan: ${{ steps.matrix.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate requested source
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python .github/scripts/ci/commands.py source
      - run: pip install --quiet PyYAML==6.0.2
      - name: Validate controller implementation
        run: |
          python -m pip install --quiet pytest==8.3.5
          python -m pytest --confcutdir=tests/ci tests/ci -q
      - name: Checkout immutable candidate data
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repository }}
          ref: ${{ steps.pr.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Generate requested plan with controller code
        id: matrix
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          python .github/scripts/ci/flagcicd_plan.py plan \
            --root "$GITHUB_WORKSPACE/candidate" --profile requested \
            --requested-platform "$REQUESTED_PLATFORM" --control-sha "$(git rev-parse HEAD)" \
            --file "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
          retention-days: 7

  platform-pipeline:
    name: Requested platform (${{ matrix.platform }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.resolve.outputs.platforms) }}
    # Do not pass report secrets to explicitly requested PR source code.
    uses: ./.github/workflows/_platform_pipeline.yml
    with:
      platform: ${{ matrix.platform }}
      test_plan: ${{ needs.resolve.outputs.plan }}
      source_repository: ${{ needs.resolve.outputs.source_repository }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  requested-complete:
    name: Requested CI Complete
    needs: [resolve, platform-pipeline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyYAML==6.0.2
      - name: Recheck current PR source
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python .github/scripts/ci/commands.py source
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-evidence-*
          path: ${{ runner.temp }}/ci-evidence
          merge-multiple: true
      - name: Verify requested plan and execution evidence
        env:
          PLAN_JSON: ${{ needs.resolve.outputs.plan }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PLATFORMS: ${{ needs.resolve.outputs.platforms || '[]' }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: '["resolve"]'
          EVIDENCE_ROOT: ${{ runner.temp }}/ci-evidence
        run: python .github/scripts/ci/check_results.py
