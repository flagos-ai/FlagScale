name: CI comment command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write

concurrency:
  group: ci-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci run ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/ci
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const command = require('./.github/scripts/ci/slash_command.js');
            await command({ github, context, core });
