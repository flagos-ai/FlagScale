name: all_tests

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - 'docker/**'
      - 'tools/install/**'
      - 'requirements/**'
      - '.github/workflows/build_image.yml'
      - '.github/workflows/build_image_common.yml'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - 'docker/**'
      - 'tools/install/**'
      - 'requirements/**'
      - '.github/workflows/build_image.yml'
      - '.github/workflows/build_image_common.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - cuda
          - ascend
          - enflame
          - hygon
          - metax
          - musa
          - kunlunxin

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  # CUDA Platform
  cuda_prepare:
    name: CUDA / prepare-deps
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'cuda'
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: cuda

  cuda_tests:
    name: CUDA / tests
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'cuda'
    needs: cuda_prepare
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: cuda
      megatron_cache_key: ${{ needs.cuda_prepare.outputs.megatron_cache_key }}
      megatron_artifact_available: ${{ needs.cuda_prepare.outputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ needs.cuda_prepare.outputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ needs.cuda_prepare.outputs.te_fl_artifact_available }}

  # Ascend Platform
  ascend_prepare:
    name: Ascend / prepare-deps
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ascend'
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: ascend

  ascend_tests:
    name: Ascend / tests
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ascend'
    needs: ascend_prepare
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: ascend
      megatron_cache_key: ${{ needs.ascend_prepare.outputs.megatron_cache_key }}
      megatron_artifact_available: ${{ needs.ascend_prepare.outputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ needs.ascend_prepare.outputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ needs.ascend_prepare.outputs.te_fl_artifact_available }}

  # Enflame Platform
  enflame_prepare:
    name: Enflame / prepare-deps
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'enflame'
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: enflame

  enflame_tests:
    name: Enflame / tests
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'enflame'
    needs: enflame_prepare
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: enflame
      megatron_cache_key: ${{ needs.enflame_prepare.outputs.megatron_cache_key }}
      megatron_artifact_available: ${{ needs.enflame_prepare.outputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ needs.enflame_prepare.outputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ needs.enflame_prepare.outputs.te_fl_artifact_available }}

  # Hygon Platform
  hygon_prepare:
    name: Hygon / prepare-deps
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'hygon'
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: hygon

  hygon_tests:
    name: Hygon / tests
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'hygon'
    needs: hygon_prepare
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: hygon
      megatron_cache_key: ${{ needs.hygon_prepare.outputs.megatron_cache_key }}
      megatron_artifact_available: ${{ needs.hygon_prepare.outputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ needs.hygon_prepare.outputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ needs.hygon_prepare.outputs.te_fl_artifact_available }}

  # MetaX Platform
  metax_prepare:
    name: MetaX / prepare-deps
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'metax'
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: metax

  metax_tests:
    name: MetaX / tests
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'metax'
    needs: metax_prepare
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: metax
      megatron_cache_key: ${{ needs.metax_prepare.outputs.megatron_cache_key }}
      megatron_artifact_available: ${{ needs.metax_prepare.outputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ needs.metax_prepare.outputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ needs.metax_prepare.outputs.te_fl_artifact_available }}

  # MUSA Platform
  musa_prepare:
    name: MUSA / prepare-deps
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'musa'
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: musa

  musa_tests:
    name: MUSA / tests
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'musa'
    needs: musa_prepare
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: musa
      megatron_cache_key: ${{ needs.musa_prepare.outputs.megatron_cache_key }}
      megatron_artifact_available: ${{ needs.musa_prepare.outputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ needs.musa_prepare.outputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ needs.musa_prepare.outputs.te_fl_artifact_available }}

  # Kunlunxin Platform
  kunlunxin_prepare:
    name: Kunlunxin / prepare-deps
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'kunlunxin'
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: kunlunxin

  kunlunxin_tests:
    name: Kunlunxin / tests
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'kunlunxin'
    needs: kunlunxin_prepare
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: kunlunxin
      megatron_cache_key: ${{ needs.kunlunxin_prepare.outputs.megatron_cache_key }}
      megatron_artifact_available: ${{ needs.kunlunxin_prepare.outputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ needs.kunlunxin_prepare.outputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ needs.kunlunxin_prepare.outputs.te_fl_artifact_available }}

  all_tests:
    name: all_tests
    needs:
      - cuda_prepare
      - ascend_prepare
      - enflame_prepare
      - hygon_prepare
      - metax_prepare
      - musa_prepare
      - kunlunxin_prepare
      - cuda_tests
      - ascend_tests
      - enflame_tests
      - hygon_tests
      - metax_tests
      - musa_tests
      - kunlunxin_tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify workflow status
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = False
          for name, job in jobs.items():
              result = job["result"]
              if result not in ("success", "skipped"):
                  print(f"::error::{name}: {result}")
                  failed = True
              if name.endswith("_prepare") and result == "success":
                  tests = name.removesuffix("_prepare") + "_tests"
                  if jobs[tests]["result"] != "success":
                      print(f"::error::{tests} did not succeed after preparation")
                      failed = True
          if failed:
              sys.exit(1)
          print("All requested platform tests passed!")
          PY
