name: Common All Tests

on:
  workflow_call:
    secrets:
      FLAGCICD_API_TOKEN:
        required: false
        description: Optional FlagCICD report upload token; unavailable in fork PRs
    inputs:
      test_plan:
        type: string
        required: false
        default: ''
        description: Validated FlagScale test plan; empty preserves legacy full execution
      source_repository:
        type: string
        required: false
        default: ''
        description: Explicit source repository for PR comment requests
      source_sha:
        type: string
        required: false
        default: ''
        description: Immutable source commit for PR comment requests
      platform:
        required: true
        type: string
        description: Platform name (e.g., cuda, default)
      megatron_cache_key:
        required: false
        type: string
        default: ''
        description: Megatron-LM-FL cache key from prepare_dependencies
      megatron_artifact_available:
        required: false
        type: string
        default: 'false'
        description: Whether prepare_dependencies uploaded a same-run Megatron artifact
      te_fl_cache_key:
        required: false
        type: string
        default: ''
        description: TE-FL cache key from prepare_dependencies
      te_fl_artifact_available:
        required: false
        type: string
        default: 'false'
        description: Whether prepare_dependencies uploaded a same-run TE-FL artifact
      ci_train_image:
        required: false
        type: string
        description: Override train image (e.g., newly built image). Falls back to platform config if not set.
        default: ""
      ci_inference_image:
        required: false
        type: string
        description: Override inference image. Falls back to platform config if not set.
        default: ""
      runs_on:
        required: false
        type: string
        description: Override runs_on. Falls back to platform config if not set.
        default: ""
      container_volumes:
        required: false
        type: string
        description: Override container_volumes. Falls back to platform config if not set.
        default: ""
      train_pkg_mgr:
        required: false
        type: string
        default: ""
      train_env_name:
        required: false
        type: string
        default: ""
      train_env_path:
        required: false
        type: string
        default: ""
      inference_pkg_mgr:
        required: false
        type: string
        default: ""
      inference_env_name:
        required: false
        type: string
        default: ""
      inference_env_path:
        required: false
        type: string
        default: ""
      serve_pkg_mgr:
        required: false
        type: string
        default: ""
      serve_env_name:
        required: false
        type: string
        default: ""
      serve_env_path:
        required: false
        type: string
        default: ""

jobs:
  checkout_and_config:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    outputs:
      unit_selection: ${{ steps.plan.outputs.unit_selection }}
      # ci_image: ${{ steps.config.outputs.ci_image }}
      ci_train_image: ${{ steps.config.outputs.ci_train_image }}
      ci_inference_image: ${{ steps.config.outputs.ci_inference_image }}
      runs_on: ${{ steps.config.outputs.runs_on }}
      container_volumes: ${{ steps.config.outputs.container_volumes }}
      container_options: ${{ steps.config.outputs.container_options }}
      unit_timeout_minutes: ${{ steps.config.outputs.unit_timeout_minutes }}
      runtime_recovery_timeout_minutes: ${{ steps.config.outputs.runtime_recovery_timeout_minutes }}
      device_types: ${{ steps.config.outputs.device_types }}
      megatron_lm_fl_enabled: ${{ steps.config.outputs.megatron_lm_fl_enabled }}
      te_fl_enabled: ${{ steps.config.outputs.te_fl_enabled }}
      megatron_runtime_environment: ${{ steps.config.outputs.megatron_runtime_environment }}
      te_fl_runtime_environment: ${{ steps.config.outputs.te_fl_runtime_environment }}
      te_fl_install_pip_args: ${{ steps.config.outputs.te_fl_install_pip_args }}
      te_fl_runtime_pip_packages: ${{ steps.config.outputs.te_fl_runtime_pip_packages }}
      setup_script: ${{ steps.config.outputs.setup_script }}
      train_test_matrix: ${{ steps.plan.outputs.train_test_matrix || steps.config.outputs.train_test_matrix }}
      hetero_train_test_matrix: ${{ steps.plan.outputs.hetero_train_test_matrix || steps.config.outputs.hetero_train_test_matrix }}
      inference_test_matrix: ${{ steps.config.outputs.inference_test_matrix }}
      serve_test_matrix: ${{ steps.config.outputs.serve_test_matrix }}
      rl_test_matrix: ${{ steps.config.outputs.rl_test_matrix }}
      benchmark_test_matrix: ${{ steps.plan.outputs.benchmark_test_matrix || steps.config.outputs.benchmark_test_matrix }}
      inference_timeout_minutes: ${{ steps.config.outputs.inference_timeout_minutes }}
      serve_ready_timeout_seconds: ${{ steps.config.outputs.serve_ready_timeout_seconds }}
      pkg_mgr_train: ${{ steps.config.outputs.pkg_mgr_train || steps.config.outputs.pkg_mgr }}
      pkg_mgr_inference: ${{ steps.config.outputs.pkg_mgr_inference || steps.config.outputs.pkg_mgr }}
      pkg_mgr_serve: ${{ steps.config.outputs.pkg_mgr_serve || steps.config.outputs.pkg_mgr }}
      env_path_train: ${{ steps.config.outputs.env_path_train || steps.config.outputs.env_path }}
      env_path_inference: ${{ steps.config.outputs.env_path_inference || steps.config.outputs.env_path }}
      env_path_serve: ${{ steps.config.outputs.env_path_serve || steps.config.outputs.env_path }}
      env_name_train: ${{ steps.config.outputs.env_name_train }}
      env_name_inference: ${{ steps.config.outputs.env_name_inference }}
      env_name_serve: ${{ steps.config.outputs.env_name_serve }}
      env_name_rl: ${{ steps.config.outputs.env_name_rl }}
    steps:
      - name: Checkout code (attempt 1)
        id: checkout_attempt_1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ inputs.source_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Checkout code (attempt 2)
        if: steps.checkout_attempt_1.outcome == 'failure'
        id: checkout_attempt_2
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ inputs.source_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Checkout code (attempt 3)
        if: steps.checkout_attempt_2.outcome == 'failure'
        id: checkout_attempt_3
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Load platform configuration
        id: config
        run: |
          set -euo pipefail

          PLATFORM="${{ inputs.platform }}"
          CONFIG_FILE=".github/configs/${PLATFORM}.yml"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Error: Platform configuration file not found: $CONFIG_FILE"
            echo "Available configs:"
            ls -la .github/configs/
            exit 1
          fi

          # Install mikefarah/yq (v4) for YAML parsing
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          /usr/local/bin/yq --version

          # Source the platform config loading script
          source ./tools/install/utils/load_platform_config.sh

          # Load configuration and group tests by task
          load_platform_config "$PLATFORM"

          # Override images if provided as inputs
          if [ -n "${{ inputs.ci_train_image }}" ]; then
            echo "ci_train_image=${{ inputs.ci_train_image }}" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ inputs.ci_inference_image }}" ]; then
            echo "ci_inference_image=${{ inputs.ci_inference_image }}" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ inputs.train_pkg_mgr }}" ]; then
            echo "pkg_mgr_train=${{ inputs.train_pkg_mgr }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.train_env_name }}" ]; then
            echo "env_name_train=${{ inputs.train_env_name }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.train_env_path }}" ]; then
            echo "env_path_train=${{ inputs.train_env_path }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.inference_pkg_mgr }}" ]; then
            echo "pkg_mgr_inference=${{ inputs.inference_pkg_mgr }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.inference_env_name }}" ]; then
            echo "env_name_inference=${{ inputs.inference_env_name }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.inference_env_path }}" ]; then
            echo "env_path_inference=${{ inputs.inference_env_path }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.serve_pkg_mgr }}" ]; then
            echo "pkg_mgr_serve=${{ inputs.serve_pkg_mgr }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.serve_env_name }}" ]; then
            echo "env_name_serve=${{ inputs.serve_env_name }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.serve_env_path }}" ]; then
            echo "env_path_serve=${{ inputs.serve_env_path }}" >> "$GITHUB_OUTPUT"
          fi
          # Use single-quoted assignment so bash treats the JSON value literally
          # (double quotes inside the JSON would break echo "runs_on=${{ inputs.runs_on }}")
          RUNS_ON_INPUT='${{ inputs.runs_on }}'
          if [ -n "$RUNS_ON_INPUT" ]; then
            { echo 'runs_on<<EOFRUNSON_INPUT'; echo "$RUNS_ON_INPUT"; echo 'EOFRUNSON_INPUT'; } >> $GITHUB_OUTPUT
          fi
          # (double quotes inside the JSON would break echo "container_volumes=${{ inputs.container_volumes }}")
          CONTAINER_VOLUMES_INPUT='${{ inputs.container_volumes }}'
          if [ -n "$CONTAINER_VOLUMES_INPUT" ]; then
            { echo 'container_volumes<<EOFRUNSON_INPUT'; echo "$CONTAINER_VOLUMES_INPUT"; echo 'EOFRUNSON_INPUT'; } >> $GITHUB_OUTPUT
          fi

      - name: Set up plan validator
        if: inputs.test_plan != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and slice test plan
        if: inputs.test_plan != ''
        id: plan
        env:
          TEST_PLAN: ${{ inputs.test_plan }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML==6.0.2
          printf '%s\n' "$TEST_PLAN" > "$RUNNER_TEMP/plan.json"
          python .github/scripts/ci/flagcicd_plan.py slice \
            --file "$RUNNER_TEMP/plan.json" --platform "$PLATFORM" >> "$GITHUB_OUTPUT"

  # CLI validation runs first (outside virtual env) as a gate for all subsequent tests
  cli_validation:
    needs: checkout_and_config
    uses: ./.github/workflows/functional_tests_cli.yml
    with:
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
      platform: ${{ inputs.platform }}
      image: ${{ needs.checkout_and_config.outputs.ci_train_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      pkg_mgr: ${{ needs.checkout_and_config.outputs.pkg_mgr_train }}
      env_name: ${{ needs.checkout_and_config.outputs.env_name_train }}
      env_path: ${{ needs.checkout_and_config.outputs.env_path_train }}

  unit_tests:
    needs:
      - checkout_and_config
      - cli_validation
    if: fromJson(needs.checkout_and_config.outputs.device_types)[0] != null
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.checkout_and_config.outputs.device_types) }}
    uses: ./.github/workflows/unit_tests_common.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    name: unit_tests
    with:
      unit_selection: ${{ needs.checkout_and_config.outputs.unit_selection }}
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
      runtime_recovery_timeout_minutes: ${{ fromJson(needs.checkout_and_config.outputs.runtime_recovery_timeout_minutes) }}
      unit_timeout_minutes: ${{ fromJson(needs.checkout_and_config.outputs.unit_timeout_minutes) }}
      platform: ${{ inputs.platform }}
      device: ${{ matrix.device }}
      image: ${{ needs.checkout_and_config.outputs.ci_train_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      pkg_mgr: ${{ needs.checkout_and_config.outputs.pkg_mgr_train }}
      env_name: ${{ needs.checkout_and_config.outputs.env_name_train }}
      env_path: ${{ needs.checkout_and_config.outputs.env_path_train }}
      megatron_cache_key: ${{ inputs.megatron_cache_key }}
      megatron_artifact_available: ${{ inputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ inputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ inputs.te_fl_artifact_available }}
      megatron_lm_fl_enabled: ${{ needs.checkout_and_config.outputs.megatron_lm_fl_enabled }}
      te_fl_enabled: ${{ needs.checkout_and_config.outputs.te_fl_enabled }}
      megatron_runtime_environment: ${{ needs.checkout_and_config.outputs.megatron_runtime_environment }}
      te_fl_runtime_environment: ${{ needs.checkout_and_config.outputs.te_fl_runtime_environment }}
      te_fl_install_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_install_pip_args }}
      te_fl_runtime_pip_packages: ${{ needs.checkout_and_config.outputs.te_fl_runtime_pip_packages }}

  functional_tests_train:
    needs:
      - checkout_and_config
      - cli_validation
      - unit_tests
    if: fromJson(needs.checkout_and_config.outputs.train_test_matrix)[0] != null
    uses: ./.github/workflows/functional_tests_train.yml
    with:
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
      runtime_recovery_timeout_minutes: ${{ fromJson(needs.checkout_and_config.outputs.runtime_recovery_timeout_minutes) }}
      platform: ${{ inputs.platform }}
      test_matrix: ${{ needs.checkout_and_config.outputs.train_test_matrix }}
      image: ${{ needs.checkout_and_config.outputs.ci_train_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      pkg_mgr: ${{ needs.checkout_and_config.outputs.pkg_mgr_train }}
      env_name: ${{ needs.checkout_and_config.outputs.env_name_train }}
      env_path: ${{ needs.checkout_and_config.outputs.env_path_train }}
      megatron_cache_key: ${{ inputs.megatron_cache_key }}
      megatron_artifact_available: ${{ inputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ inputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ inputs.te_fl_artifact_available }}
      megatron_lm_fl_enabled: ${{ needs.checkout_and_config.outputs.megatron_lm_fl_enabled }}
      te_fl_enabled: ${{ needs.checkout_and_config.outputs.te_fl_enabled }}
      megatron_runtime_environment: ${{ needs.checkout_and_config.outputs.megatron_runtime_environment }}
      te_fl_runtime_environment: ${{ needs.checkout_and_config.outputs.te_fl_runtime_environment }}
      te_fl_install_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_install_pip_args }}
      te_fl_runtime_pip_packages: ${{ needs.checkout_and_config.outputs.te_fl_runtime_pip_packages }}

  functional_tests_hetero_train:
    needs:
      - checkout_and_config
      - cli_validation
      - unit_tests
    if: fromJson(needs.checkout_and_config.outputs.hetero_train_test_matrix)[0] != null
    uses: ./.github/workflows/functional_tests_hetero_train.yml
    with:
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
      runtime_recovery_timeout_minutes: ${{ fromJson(needs.checkout_and_config.outputs.runtime_recovery_timeout_minutes) }}
      platform: ${{ inputs.platform }}
      test_matrix: ${{ needs.checkout_and_config.outputs.hetero_train_test_matrix }}
      image: ${{ needs.checkout_and_config.outputs.ci_train_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      pkg_mgr: ${{ needs.checkout_and_config.outputs.pkg_mgr_train }}
      env_name: ${{ needs.checkout_and_config.outputs.env_name_train }}
      env_path: ${{ needs.checkout_and_config.outputs.env_path_train }}
      megatron_cache_key: ${{ inputs.megatron_cache_key }}
      megatron_artifact_available: ${{ inputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ inputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ inputs.te_fl_artifact_available }}
      megatron_lm_fl_enabled: ${{ needs.checkout_and_config.outputs.megatron_lm_fl_enabled }}
      te_fl_enabled: ${{ needs.checkout_and_config.outputs.te_fl_enabled }}
      megatron_runtime_environment: ${{ needs.checkout_and_config.outputs.megatron_runtime_environment }}
      te_fl_runtime_environment: ${{ needs.checkout_and_config.outputs.te_fl_runtime_environment }}
      te_fl_install_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_install_pip_args }}
      te_fl_runtime_pip_packages: ${{ needs.checkout_and_config.outputs.te_fl_runtime_pip_packages }}

  functional_tests_inference:
    needs:
      - checkout_and_config
      - cli_validation
      - unit_tests
    # TODO: Re-enable after vLLM-plugin-FL integration is restored
    if: false  # Temporarily disabled - was: fromJson(needs.checkout_and_config.outputs.inference_test_matrix)[0] != null
    uses: ./.github/workflows/functional_tests_inference.yml
    with:
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
      platform: ${{ inputs.platform }}
      test_matrix: ${{ needs.checkout_and_config.outputs.inference_test_matrix }}
      image: ${{ needs.checkout_and_config.outputs.ci_inference_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      pkg_mgr: ${{ needs.checkout_and_config.outputs.pkg_mgr_inference }}
      env_name: ${{ needs.checkout_and_config.outputs.env_name_inference }}
      env_path: ${{ needs.checkout_and_config.outputs.env_path_inference }}
      timeout_minutes: ${{ fromJSON(needs.checkout_and_config.outputs.inference_timeout_minutes) }}

  functional_tests_serve:
    needs:
      - checkout_and_config
      - cli_validation
      - unit_tests
    # TODO: Re-enable after vLLM-plugin-FL integration is restored
    if: false  # Temporarily disabled - was: fromJson(needs.checkout_and_config.outputs.serve_test_matrix)[0] != null
    uses: ./.github/workflows/functional_tests_serve.yml
    with:
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
      platform: ${{ inputs.platform }}
      test_matrix: ${{ needs.checkout_and_config.outputs.serve_test_matrix }}
      image: ${{ needs.checkout_and_config.outputs.ci_inference_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      pkg_mgr: ${{ needs.checkout_and_config.outputs.pkg_mgr_serve }}
      env_name: ${{ needs.checkout_and_config.outputs.env_name_serve }}
      env_path: ${{ needs.checkout_and_config.outputs.env_path_serve }}
      ready_timeout_seconds: ${{ fromJSON(needs.checkout_and_config.outputs.serve_ready_timeout_seconds) }}

  # NOTE: rl functional tests are temporarily disabled
  # functional_tests_rl:
  #   needs:
  #     - checkout_and_config
  #     - unit_tests
  #   if: fromJson(needs.checkout_and_config.outputs.rl_test_matrix)[0] != null
  #   uses: ./.github/workflows/functional_tests_rl.yml
  #   with:
  #     platform: ${{ inputs.platform }}
  #     test_matrix: ${{ needs.checkout_and_config.outputs.rl_test_matrix }}
  #     image: ${{ needs.checkout_and_config.outputs.ci_image }}
  #     runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
  #     container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
  #     container_options: ${{ needs.checkout_and_config.outputs.container_options }}
  #     pkg_mgr: ${{ needs.checkout_and_config.outputs.pkg_mgr }}
  #     env_name: ${{ needs.checkout_and_config.outputs.env_name_rl }}
  #     env_path: ${{ needs.checkout_and_config.outputs.env_path }}

  functional_tests_benchmark:
    needs:
      - checkout_and_config
      - cli_validation
      - unit_tests
    if: fromJson(needs.checkout_and_config.outputs.benchmark_test_matrix)[0] != null
    uses: ./.github/workflows/functional_tests_benchmark.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
      runtime_recovery_timeout_minutes: ${{ fromJson(needs.checkout_and_config.outputs.runtime_recovery_timeout_minutes) }}
      platform: ${{ inputs.platform }}
      test_matrix: ${{ needs.checkout_and_config.outputs.benchmark_test_matrix }}
      image: ${{ needs.checkout_and_config.outputs.ci_train_image }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      pkg_mgr: ${{ needs.checkout_and_config.outputs.pkg_mgr_train }}
      env_name: ${{ needs.checkout_and_config.outputs.env_name_train }}
      env_path: ${{ needs.checkout_and_config.outputs.env_path_train }}
      megatron_cache_key: ${{ inputs.megatron_cache_key }}
      megatron_artifact_available: ${{ inputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ inputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ inputs.te_fl_artifact_available }}
      megatron_lm_fl_enabled: ${{ needs.checkout_and_config.outputs.megatron_lm_fl_enabled }}
      te_fl_enabled: ${{ needs.checkout_and_config.outputs.te_fl_enabled }}
      megatron_runtime_environment: ${{ needs.checkout_and_config.outputs.megatron_runtime_environment }}
      te_fl_runtime_environment: ${{ needs.checkout_and_config.outputs.te_fl_runtime_environment }}
      te_fl_install_pip_args: ${{ needs.checkout_and_config.outputs.te_fl_install_pip_args }}
      te_fl_runtime_pip_packages: ${{ needs.checkout_and_config.outputs.te_fl_runtime_pip_packages }}

  all_tests_complete:
    defaults:
      run:
        shell: bash
    needs:
      - checkout_and_config
      - cli_validation
      - unit_tests
      - functional_tests_train
      - functional_tests_hetero_train
      - functional_tests_benchmark
      - functional_tests_inference
      - functional_tests_serve
      # NOTE: Disabled tests removed from needs
      # - functional_tests_rl
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout plan validator
        if: inputs.test_plan != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up plan validator
        if: inputs.test_plan != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plan validation dependency
        if: inputs.test_plan != ''
        run: python -m pip install --quiet PyYAML==6.0.2
      - name: Download platform execution evidence
        if: inputs.test_plan != ''
        uses: actions/download-artifact@v4
        with:
          pattern: ci-evidence-${{ inputs.platform }}-*
          path: ${{ runner.temp }}/ci-evidence
          merge-multiple: true
      - name: Verify all tests passed
        env:
          TEST_PLAN: ${{ inputs.test_plan }}
          PLATFORM: ${{ inputs.platform }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          if [ -n "$TEST_PLAN" ]; then
            printf '%s\n' "$TEST_PLAN" > "$RUNNER_TEMP/plan.json"
            python .github/scripts/ci/flagcicd_plan.py check \
              --file "$RUNNER_TEMP/plan.json" --platform "$PLATFORM" || exit $?
            python .github/scripts/ci/flagcicd_evidence.py verify \
              --plan-file "$RUNNER_TEMP/plan.json" --platform "$PLATFORM" \
              --output-root "$RUNNER_TEMP/ci-evidence"
            exit $?
          fi
          # Check all test jobs (skip if not run)
          failed=false
          if [ "${{ needs.checkout_and_config.result }}" != "success" ]; then
            echo "Platform configuration did not succeed"
            failed=true
          fi

          if [ "${{ needs.unit_tests.result }}" != "success" ] && \
             [ "${{ needs.unit_tests.result }}" != "skipped" ]; then
            echo "❌ Unit tests failed"
            failed=true
          fi

          if [ "${{ needs.cli_validation.result }}" != "success" ] && \
             [ "${{ needs.cli_validation.result }}" != "skipped" ]; then
            echo "❌ CLI validation failed"
            failed=true
          fi

          # Only check functional tests if they ran
          if [ "${{ needs.functional_tests_train.result }}" != "success" ] && \
             [ "${{ needs.functional_tests_train.result }}" != "skipped" ]; then
            echo "❌ Training functional tests failed"
            failed=true
          fi

          if [ "${{ needs.functional_tests_hetero_train.result }}" != "success" ] && \
             [ "${{ needs.functional_tests_hetero_train.result }}" != "skipped" ]; then
            echo "❌ Heterogeneous training functional tests failed"
            failed=true
          fi

          if [ "${{ needs.functional_tests_benchmark.result }}" != "success" ] && \
             [ "${{ needs.functional_tests_benchmark.result }}" != "skipped" ]; then
            echo "❌ Benchmark tests failed"
            failed=true
          fi

          if [ "${{ needs.functional_tests_inference.result }}" != "success" ] && \
             [ "${{ needs.functional_tests_inference.result }}" != "skipped" ]; then
            echo "❌ Inference functional tests failed"
            failed=true
          fi

          if [ "${{ needs.functional_tests_serve.result }}" != "success" ] && \
             [ "${{ needs.functional_tests_serve.result }}" != "skipped" ]; then
            echo "❌ Serve functional tests failed"
            failed=true
          fi

          # RL remains disabled and is intentionally absent from this gate.

          if [ "$failed" = "true" ]; then
            exit 1
          fi

          echo "✅ All tests completed successfully!"
