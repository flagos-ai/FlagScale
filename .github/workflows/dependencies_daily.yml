name: Daily Dependencies Sync

on:
  schedule:
    # Rotate every 18 hours so a TE-FL main advance leaves at most one
    # 18-hour window where PRs must download the artifact over the network.
    # 22:17 -> 04:17 is 6h, 04:17 -> 22:17 is 18h.
    - cron: '17 4,22 * * *'
  workflow_dispatch:

concurrency:
  group: dependencies-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-ppu:
    name: prepare-ppu
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: ppu

  prepare-metax:
    name: prepare-metax
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: metax

  prepare-ascend:
    name: prepare-ascend
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: ascend

  prepare-musa:
    name: prepare-musa
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: musa

  prepare-hygon:
    name: prepare-hygon
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: hygon

  prepare-enflame:
    name: prepare-enflame
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: enflame

  prepare-kunlunxin:
    name: prepare-kunlunxin
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: kunlunxin

  prepare-cuda:
    name: prepare-cuda
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: cuda
