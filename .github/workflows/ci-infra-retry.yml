name: CI Infrastructure Retry

on:
  workflow_run:
    workflows: [CI, Nightly]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-infra-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run has write permissions. Never check out the failed run's code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect trusted CI and retry eligible failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python .github/scripts/ci/infra_retry.py
