name: Build Docker Images - Musa

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/musa/**'
      - 'tools/install/musa/**'
      - 'requirements/musa/**'
      - '.github/workflows/build_image_common.yml'
      - '.github/workflows/build_image_musa.yml'
  workflow_dispatch:
    inputs:
      task:
        description: Image task to build
        required: true
        type: choice
        options: [train, inference, all]
        default: all
      target:
        description: Docker build target
        required: true
        type: choice
        options: [dev, release]
        default: dev
      build_images:
        description: Build new MUSA images (temporarily opt-in)
        type: boolean
        default: false
      build_all_tasks:
        description: Build train, inference and all-in-one images
        type: boolean
        default: true
      push:
        description: Push the candidate image to Harbor
        type: boolean
        default: true
      promote:
        description: Promote validated candidate images to release tags
        type: boolean
        default: false
      run_tests:
        description: Validate images built by this workflow
        type: boolean
        default: false
      no_cache:
        description: Build without Docker cache
        type: boolean
        default: false
      base_image:
        description: Optional trusted override for the pinned S5000 base image
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: harbor.baai.ac.cn
  REGISTRY_NAMESPACE: flagscale
  # Keep the PR build path intact while S5000 capacity is constrained. Set this
  # to true when automatic image builds can be re-enabled.
  MUSA_PR_BUILD_ENABLED: 'false'
  # PyTorch 2.7.1/MCCL is the newest base verified with the S5000 fleet's
  # 3.3.5-server driver. The vendor PyTorch 2.9.1 image passes tensor smoke but
  # fails communicator creation, so upgrading it must be coupled with drivers.
  MUSA_BASE_IMAGE: harbor.baai.ac.cn/flagos-dev/transformerengine-fl@sha256:fb56b8b2882d20de45954ed0d53fd695ae08a23c808d853dae9e57f4fcae618e
  MUSA_MEGATRON_REPO: https://github.com/flagos-ai/Megatron-LM-FL.git
  MUSA_MEGATRON_REF: 175ae90ec92a9e6fea2d74ccd24d6a1835d3ae82
  MUSA_TE_REF: e73781e85518ab0046007cef69e95bd258a63900
  MUSA_TE_VERSION: 2.0.0+e73781e
  MUSA_RUNTIME_SMOKE_NPROC: '2'
  PYTHON_VERSION: '3.10'
  PKG_MGR: pip
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_DEFAULT_TIMEOUT: '300'

jobs:
  prepare:
    name: Prepare MUSA build parameters
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.params.outputs.target }}
      matrix: ${{ steps.params.outputs.matrix }}
      publish: ${{ steps.params.outputs.publish }}
      candidate_push: ${{ steps.params.outputs.candidate_push }}
      run_tests: ${{ steps.params.outputs.run_tests }}
      build_images: ${{ steps.params.outputs.build_images }}
      no_cache: ${{ steps.params.outputs.no_cache }}
      base_image: ${{ steps.params.outputs.base_image }}
      train_image: ${{ steps.params.outputs.train_image }}
      inference_image: ${{ steps.params.outputs.inference_image }}
      all_image: ${{ steps.params.outputs.all_image }}
      release_train_image: ${{ steps.params.outputs.release_train_image }}
      release_inference_image: ${{ steps.params.outputs.release_inference_image }}
      release_all_image: ${{ steps.params.outputs.release_all_image }}
    steps:
      - name: Compute parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ inputs.target || 'dev' }}"
          PUBLISH=false
          CANDIDATE_PUSH=false
          RUN_TESTS=false
          BUILD_IMAGES=false
          NO_CACHE=false
          BASE_IMAGE="${{ env.MUSA_BASE_IMAGE }}"
          MATRIX='{"task":["train","inference","all"]}'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BUILD_IMAGES="${{ env.MUSA_PR_BUILD_ENABLED }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            PUBLISH=true
            CANDIDATE_PUSH=true
            RUN_TESTS=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_IMAGES="${{ inputs.build_images }}"
            if [ -z "$BUILD_IMAGES" ]; then
              BUILD_IMAGES=false
            fi
            PUBLISH="${{ inputs.promote }}"
            CANDIDATE_PUSH="${{ inputs.push }}"
            RUN_TESTS="${{ inputs.run_tests }}"
            NO_CACHE="${{ inputs.no_cache }}"
            if [ -n "${{ inputs.base_image }}" ]; then
              BASE_IMAGE="${{ inputs.base_image }}"
            fi
            if [ "${{ inputs.build_all_tasks }}" != "true" ]; then
              MATRIX='{"task":["${{ inputs.task }}"]}'
            fi
            if [ "$RUN_TESTS" = "true" ] && [ "$BUILD_IMAGES" != "true" ]; then
              echo "::error::run_tests=true requires build_images=true; normal tests use the validated images from .github/configs/musa.yml"
              exit 1
            fi
            if [ "$RUN_TESTS" = "true" ] && [ "$CANDIDATE_PUSH" != "true" ]; then
              echo "::error::run_tests=true requires push=true so reusable jobs can pull the image"
              exit 1
            fi
            if [ "$RUN_TESTS" = "true" ] && [ "${{ inputs.build_all_tasks }}" != "true" ]; then
              echo "::error::run_tests=true requires build_all_tasks=true"
              exit 1
            fi
            if [ "$PUBLISH" = "true" ] && [ "$RUN_TESTS" != "true" ]; then
              echo "::error::promote=true requires run_tests=true"
              exit 1
            fi
            if [ "$BUILD_IMAGES" != "true" ]; then
              if [ "$PUBLISH" = "true" ]; then
                echo "::error::promote=true requires build_images=true"
                exit 1
              fi
              CANDIDATE_PUSH=false
            fi
          fi

          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SHORT_SHA="${SOURCE_SHA::12}"
          TRAIN_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-train:candidate-${TARGET}-musa-s5000-py${{ env.PYTHON_VERSION }}-${SHORT_SHA}"
          INFERENCE_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-inference:candidate-${TARGET}-musa-s5000-py${{ env.PYTHON_VERSION }}-${SHORT_SHA}"
          ALL_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-all:candidate-${TARGET}-musa-s5000-py${{ env.PYTHON_VERSION }}-${SHORT_SHA}"
          RELEASE_TRAIN_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-train:${TARGET}-musa-s5000-py${{ env.PYTHON_VERSION }}-${SHORT_SHA}"
          RELEASE_INFERENCE_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-inference:${TARGET}-musa-s5000-py${{ env.PYTHON_VERSION }}-${SHORT_SHA}"
          RELEASE_ALL_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/flagscale-all:${TARGET}-musa-s5000-py${{ env.PYTHON_VERSION }}-${SHORT_SHA}"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "candidate_push=$CANDIDATE_PUSH" >> "$GITHUB_OUTPUT"
          echo "run_tests=$RUN_TESTS" >> "$GITHUB_OUTPUT"
          echo "build_images=$BUILD_IMAGES" >> "$GITHUB_OUTPUT"
          echo "no_cache=$NO_CACHE" >> "$GITHUB_OUTPUT"
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "train_image=$TRAIN_IMAGE" >> "$GITHUB_OUTPUT"
          echo "inference_image=$INFERENCE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "all_image=$ALL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "release_train_image=$RELEASE_TRAIN_IMAGE" >> "$GITHUB_OUTPUT"
          echo "release_inference_image=$RELEASE_INFERENCE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "release_all_image=$RELEASE_ALL_IMAGE" >> "$GITHUB_OUTPUT"

  validate_pr:
    name: Validate MUSA PR configuration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (attempt 1)
        id: checkout_attempt_1
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout source (attempt 2)
        id: checkout_attempt_2
        if: steps.checkout_attempt_1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout source (attempt 3)
        if: steps.checkout_attempt_2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate MUSA integration
        shell: bash
        run: |
          set -euo pipefail

          test -f docker/musa/Dockerfile.train
          test -f docker/musa/Dockerfile.inference
          test -f docker/musa/Dockerfile.all
          test -f requirements/musa/base.txt
          test -f requirements/musa/train.txt
          test -f requirements/musa/inference.txt
          test -f requirements/musa/serve.txt
          test -f tests/test_utils/config/platforms/musa.yaml
          test -f tests/functional_tests/inference/qwen3/conf/4b_tp2_musa.yaml
          test -f tests/functional_tests/serve/qwen2_5/conf/0.5b_musa.yaml
          bash -n tools/install/musa/env.sh
          bash -n tools/install/musa/install_base.sh
          bash -n tools/install/musa/install_train.sh
          bash -n tools/install/musa/install_inference.sh
          bash -n tools/install/musa/install_serve.sh
          bash -n tools/install/utils/retry_utils.sh
          bash -n tests/test_utils/runners/check_env.sh
          bash -n tests/test_utils/runners/utils.sh
          python -m py_compile tests/test_utils/runners/parse_config.py
          python -m py_compile tests/unit_tests/test_utilities.py
          python tests/test_utils/runners/parse_config.py \
            --platform musa --type device_types | grep -q 's5000'
          python tests/test_utils/runners/parse_config.py \
            --platform s5000 --type unit | grep -q 'include'
          python tests/test_utils/runners/parse_config.py \
            --platform musa --type functional --task inference | grep -q '4b_tp2_musa'
          python tests/test_utils/runners/parse_config.py \
            --platform musa --type functional --task serve | grep -q '0.5b_musa'

  build:
    needs: prepare
    uses: ./.github/workflows/build_image_common.yml
    secrets: inherit
    with:
      platform: musa
      runs_on: '["flagscale-mthreads-s5000-gpu8"]'
      matrix: ${{ needs.prepare.outputs.matrix }}
      target: ${{ needs.prepare.outputs.target }}
      build_images: ${{ needs.prepare.outputs.build_images == 'true' }}
      no_cache: ${{ needs.prepare.outputs.no_cache == 'true' }}
      push: ${{ needs.prepare.outputs.candidate_push == 'true' }}
      registry: harbor.baai.ac.cn
      train_image: ${{ needs.prepare.outputs.train_image }}
      inference_image: ${{ needs.prepare.outputs.inference_image }}
      all_image: ${{ needs.prepare.outputs.all_image }}
      base_image: ${{ needs.prepare.outputs.base_image }}
      build_args: |
        BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
        PKG_MGR=pip
        PIP_INDEX_URL=https://pypi.org/simple
        PIP_DEFAULT_TIMEOUT=300
        FLAGSCALE_MEGATRON_REPO=https://github.com/flagos-ai/Megatron-LM-FL.git
        FLAGSCALE_MEGATRON_REF=175ae90ec92a9e6fea2d74ccd24d6a1835d3ae82
        FLAGSCALE_TE_VERSION=2.0.0+e73781e

  musa_runtime:
    name: MUSA ${{ matrix.task }} runtime
    needs: [prepare, build]
    if: >-
      always() &&
      needs.prepare.outputs.run_tests == 'true' &&
      (needs.build.result == 'success' || needs.prepare.outputs.build_images == 'false')
    runs-on: flagscale-mthreads-s5000-gpu8
    strategy:
      fail-fast: false
      matrix:
        task: [train, inference, all]
    steps:
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Validate MUSA task runtime
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            train) IMAGE="${{ needs.prepare.outputs.train_image }}" ;;
            inference) IMAGE="${{ needs.prepare.outputs.inference_image }}" ;;
            all) IMAGE="${{ needs.prepare.outputs.all_image }}" ;;
          esac
          docker pull "$IMAGE"
          DEVICE_COUNT=$(docker run --rm --privileged \
            --env MTHREADS_VISIBLE_DEVICES=all \
            --env MTHREADS_DRIVER_CAPABILITIES=all "$IMAGE" \
            python -c 'import torch, torch_musa; print(torch.musa.device_count())')
          test "$DEVICE_COUNT" -ge "${{ env.MUSA_RUNTIME_SMOKE_NPROC }}"

          docker run --rm --privileged \
            --env MTHREADS_VISIBLE_DEVICES=all \
            --env MTHREADS_DRIVER_CAPABILITIES=all "$IMAGE" python -c '
          import torch
          import torch_musa
          assert torch.musa.is_available()
          x = torch.tensor(range(8), dtype=torch.float32, device="musa")
          assert (x * 2).cpu().tolist() == [0., 2., 4., 6., 8., 10., 12., 14.]
          '

          if [ "${{ matrix.task }}" != "train" ]; then
            docker run --rm --privileged \
              --env MTHREADS_VISIBLE_DEVICES=all \
              --env MTHREADS_DRIVER_CAPABILITIES=all "$IMAGE" \
              python -c '
          import vllm
          import torch_musa
          assert hasattr(torch_musa, "_MUSAC")
          print(vllm.__version__)
          '
          fi

          if [ "${{ matrix.task }}" != "inference" ]; then
            docker run --rm --privileged \
              --env MTHREADS_VISIBLE_DEVICES=all \
              --env MTHREADS_DRIVER_CAPABILITIES=all \
              --env TORCH_DEVICE_BACKEND_AUTOLOAD=0 \
              --env TORCHDYNAMO_DISABLE=1 \
              --env TORCH_COMPILE_DISABLE=1 \
              --env NVTE_TORCH_COMPILE=0 "$IMAGE" python -c '
          import torch
          import torch_musa
          import transformer_engine
          import transformer_engine_torch as tex
          for symbol in ("generic_gemm", "layernorm_fwd", "layernorm_bwd", "rmsnorm_fwd", "rmsnorm_bwd"):
              assert hasattr(tex, symbol), symbol
          from transformer_engine.pytorch import Linear
          torch.musa.set_device(0)
          layer = Linear(16, 8).to("musa")
          value = torch.randn(4, 16, device="musa", requires_grad=True)
          output = layer(value)
          output.sum().backward()
          assert bool(output.isfinite().all().item())
          assert value.grad is not None and bool(value.grad.isfinite().all().item())
          assert layer.weight.grad is not None
          assert bool(layer.weight.grad.isfinite().all().item())
          print("Native MUSA TransformerEngine:", transformer_engine.__version__)
          '
          fi

          if [ "${{ matrix.task }}" = "inference" ]; then
            exit 0
          fi

          docker run --rm --privileged \
            --env MTHREADS_VISIBLE_DEVICES=all \
            --env MTHREADS_DRIVER_CAPABILITIES=all "$IMAGE" python -c '
          import torch_musa
          import megatron.core
          from megatron.plugin.platform import get_platform
          assert get_platform().device_name() == "musa"
          '

          # Keep torchrun rendezvous inside the container. Sharing the host
          # network makes concurrent self-hosted jobs contend for c10d ports.
          docker run --rm --privileged --ipc=host \
            --env MTHREADS_VISIBLE_DEVICES=all \
            --env MTHREADS_DRIVER_CAPABILITIES=all \
            --env EXPECTED_WORLD_SIZE="${{ env.MUSA_RUNTIME_SMOKE_NPROC }}" "$IMAGE" \
            torchrun --standalone --nproc_per_node="${{ env.MUSA_RUNTIME_SMOKE_NPROC }}" \
              --no-python python -c '
          import os
          import torch
          import torch_musa
          rank = int(os.environ["LOCAL_RANK"])
          world = int(os.environ["EXPECTED_WORLD_SIZE"])
          torch.musa.set_device(rank)
          torch.distributed.init_process_group(backend="mccl")
          value = torch.tensor([rank], dtype=torch.int64, device="musa")
          torch.distributed.all_reduce(value)
          assert value.item() == world * (world - 1) // 2
          torch.distributed.destroy_process_group()
          '

  run_musa_tests:
    name: Run MUSA tests
    needs: [prepare, build]
    if: >-
      always() &&
      needs.prepare.outputs.run_tests == 'true' &&
      (needs.build.result == 'success' || needs.prepare.outputs.build_images == 'false')
    uses: ./.github/workflows/all_tests_common.yml
    secrets: inherit
    with:
      platform: musa
      ci_train_image: ${{ needs.prepare.outputs.train_image }}
      ci_inference_image: ${{ needs.prepare.outputs.inference_image }}
      runs_on: '["flagscale-mthreads-s5000-gpu8"]'
      container_volumes: '["/mnt/airs-business/cicd/baai_datasets:/home/gitlab-runner/data","/mnt/airs-business/cicd/baai_tokenizers:/home/gitlab-runner/tokenizers"]'

  promote:
    name: Promote validated MUSA images
    needs: [prepare, build, musa_runtime, run_musa_tests]
    if: >-
      needs.prepare.outputs.build_images == 'true' &&
      needs.prepare.outputs.publish == 'true' &&
      needs.prepare.outputs.run_tests == 'true' &&
      needs.musa_runtime.result == 'success' &&
      needs.run_musa_tests.result == 'success'
    runs-on: flagscale-mthreads-s5000-gpu8
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Promote candidate manifests
        shell: bash
        run: |
          set -euo pipefail

          promote() {
            docker buildx imagetools create --tag "$2" "$1"
            docker buildx imagetools inspect "$2"
          }
          promote "${{ needs.prepare.outputs.train_image }}" "${{ needs.prepare.outputs.release_train_image }}"
          promote "${{ needs.prepare.outputs.inference_image }}" "${{ needs.prepare.outputs.release_inference_image }}"
          promote "${{ needs.prepare.outputs.all_image }}" "${{ needs.prepare.outputs.release_all_image }}"

          {
            echo "### Validated MThreads MUSA images"
            echo ""
            echo "- Train: \`${{ needs.prepare.outputs.release_train_image }}\`"
            echo "- Inference: \`${{ needs.prepare.outputs.release_inference_image }}\`"
            echo "- All-in-one: \`${{ needs.prepare.outputs.release_all_image }}\`"
            echo "- Base: \`${{ needs.prepare.outputs.base_image }}\`"
            echo "- FlagScale: \`${{ github.sha }}\`"
            echo "- Megatron-LM-FL: \`${{ env.MUSA_MEGATRON_REF }}\`"
            echo "- MUSA TransformerEngine revision: \`${{ env.MUSA_TE_REF }}\`"
            echo "- MUSA TransformerEngine version: \`${{ env.MUSA_TE_VERSION }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: MUSA pipeline summary
    needs: [prepare, validate_pr, build, musa_runtime, run_musa_tests, promote]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify pipeline result
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ needs.validate_pr.result }}" = "success"
          fi
          if [ "${{ needs.prepare.outputs.build_images }}" = "true" ]; then
            test "${{ needs.build.result }}" = "success"
          fi
          if [ "${{ needs.prepare.outputs.run_tests }}" = "true" ]; then
            test "${{ needs.musa_runtime.result }}" = "success"
            test "${{ needs.run_musa_tests.result }}" = "success"
          fi
          if [ "${{ needs.prepare.outputs.publish }}" = "true" ] && \
             [ "${{ needs.prepare.outputs.run_tests }}" = "true" ]; then
            test "${{ needs.promote.result }}" = "success"
          fi

          {
            echo "### MThreads MUSA image"
            echo ""
            echo "- Train: \`${{ needs.prepare.outputs.train_image }}\`"
            echo "- Inference: \`${{ needs.prepare.outputs.inference_image }}\`"
            echo "- All-in-one: \`${{ needs.prepare.outputs.all_image }}\`"
            echo "- Target: \`${{ needs.prepare.outputs.target }}\`"
            echo "- Published: \`${{ needs.prepare.outputs.publish }}\`"
            echo "- Promoted: \`${{ needs.promote.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
