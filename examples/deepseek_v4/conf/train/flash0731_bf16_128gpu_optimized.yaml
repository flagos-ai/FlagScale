# Flash-0731 BF16, 32K sequences, optimized 128-GPU benchmark.

system:
  attention_backend: flash
  disable_bias_linear: true
  qk_layernorm: true
  dsa_kernel_backend: cudnn
  dsa_indexer_use_sparse_loss: true
  moe_router_fusion: true
  moe_permute_fusion: true
  use_fused_mhc: true
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 8
  pipeline_model_parallel_layout: Et*3|t*3|t|t*3|t*3|t*3|t*3|t*3|t*2|t*3|t|t*3|t*3|t*3|t*3|t*3L
  context_parallel_size: 4
  expert_model_parallel_size: 8
  expert_tensor_parallel_size: 1
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  recompute_granularity: full
  fine_grained_activation_offloading: false
  min_offloaded_tensor_size: 1048576
  cuda_graph_impl: none
  use_mcore_models: true
  use_flash_attn: true
  no_check_for_nan_in_loss_and_grad: false
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: native
  manual_gc: true
  manual_gc_interval: 10
  precision:
    bf16: true
    main_grads_dtype: fp32
    main_params_dtype: fp32
    exp_avg_dtype: bf16
    exp_avg_sq_dtype: bf16
  checkpoint:
    ckpt_format: torch_dist
    auto_detect_ckpt_format: true
    no_load_optim: true
    no_load_rng: true
    no_save_optim: true
    save_interval: 500
    dist_ckpt_strictness: log_all
    save: ${experiment.exp_dir}/checkpoints
  finetune: true
  logging:
    log_throughput: true
    log_interval: 1
    logging_level: 20
    log_timers_to_tensorboard: true
    log_memory_to_tensorboard: true
    log_validation_ppl_to_tensorboard: true
    tensorboard_dir: ${experiment.exp_dir}/tensorboard
    wandb_exp_name: ${experiment.exp_name}
    timing_log_level: 0
    nvtx_ranges: true
  enable_experimental: true
  recompute_method: uniform
  recompute_num_layers: 1
  distributed_timeout_minutes: 60
  high_priority_a2a_comm_stream: true
  check_weight_hash_across_dp_replicas_interval: 50
  profile: false
  profile_step_start: 10
  profile_step_end: 11
  profile_ranks:
  - 0
  - 34
  - 40
  - 42
  - 46
  - 80
  - 127
  use_pytorch_profiler: false
  record_shapes: false
  sft: true
model:
  num_layers: 43
  hidden_size: 4096
  num_attention_heads: 64
  kv_channels: 512
  max_position_embeddings: 1048576
  normalization: RMSNorm
  norm_epsilon: 1.0e-06
  swiglu: true
  untie_embeddings_and_output_weights: true
  position_embedding_type: rope
  rotary_base: 10000
  multi_latent_attention: true
  q_lora_rank: 1024
  qk_pos_emb_head_dim: 64
  v_head_dim: 512
  rotary_scaling_factor: 16
  mscale: 1.0
  mscale_all_dim: 0.0
  o_groups: 8
  o_lora_rank: 1024
  original_max_position_embeddings: 65536
  experimental_attention_variant: dsv4_hybrid
  csa_window_size: 128
  csa_compress_ratios: '[0,0,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4]'
  csa_compress_rotary_base: 160000
  dsa_indexer_n_heads: 64
  dsa_indexer_head_dim: 128
  dsa_indexer_topk: 512
  dsa_indexer_loss_coeff: 0.01
  num_experts: 256
  moe_ffn_hidden_size: 2048
  moe_shared_expert_intermediate_size: 2048
  moe_router_load_balancing_type: seq_aux_loss
  moe_router_topk: 6
  moe_aux_loss_coeff: 0.0001
  moe_router_topk_scaling_factor: 1.5
  moe_router_score_function: sqrtsoftplus
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: 0.001
  activation_func_clamp_value: 10.0
  enable_hyper_connections: true
  num_residual_streams: 4
  mhc_sinkhorn_iterations: 20
  attention_dropout: 0.0
  hidden_dropout: 0.0
  seq_length: 32768
  micro_batch_size: 1
  global_batch_size: 256
  moe_token_dispatcher_type: alltoall
  moe_hybridep_num_sms: 32
  moe_grouped_gemm: true
  moe_router_dtype: fp32
  optimizer:
    chunked_optimizer_state_offload: true
    optimizer_state_offload_chunk_size_mb: 64
    optimizer_state_offload_fraction: 1.0
    lr_scheduler:
      lr: 3.9e-06
      min_lr: 3.9e-07
      lr_warmup_init: 3.9e-07
      lr_decay_style: cosine
      lr_decay_iters: 10
      lr_warmup_iters: 1
    weight_decay: 0.1
    clip_grad: 1.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    use_precision_aware_optimizer: true
  transformer_impl: transformer_engine
  train_iters: 10
  exit_duration_in_mins: 90
  init_method_std: 0.02
  eval_iters: 0
  eval_interval: 200
  nccl_communicator_config_path: ${experiment.repo_dir}/examples/deepseek_v4/conf/ep-cta16-nccl.yaml
  exit_interval: 10
data:
  tokenizer_type: SFTTokenizer
  tokenizer_model: /workspace/models/DeepSeek-V4-Flash-0731
  actual_vocab_size: 129280
  make_vocab_size_divisible_by: 3232
  mock_data: false
  data_path: /workspace/data/code_alpaca_20k.jsonl
  split: 100,0,0
  dataloader_inter_document_masking: false
  reset_attention_mask: false
  reset_position_ids: false
  no_create_attention_mask_in_dataloader: true
