# Single-node (8 GPU) SFT smoke test for DeepSeek-V4-Flash using the ms-swift
# online data backend (Phase 1). The model is randomly initialised: this run
# exercises the SFT data path (load -> template tokenize with loss_scale ->
# packing -> collate -> forward/backward), NOT convergence.
#
# The model architecture is a small DeepSeek-V4 (mirrors the functional-test
# tp1_pp2_ep2_v4 config) so it fits on a single node and builds with the
# deepseek_v4 builder. Swap in the real HF dims + --sft-model-dir checkpoint
# once the data path is validated.

system:
  no_shared_fs: ${experiment.runner.no_shared_fs}
  num_workers: 4
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 2
  pipeline_model_parallel_layout: "Ett|ttmL"
  expert_model_parallel_size: 2
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  finetune: true
  no_load_rng: true
  no_load_optim: true
  disable_bias_linear: true
  reset_position_ids: true
  reset_attention_mask: true
  # Packed sequences use varlen (THD) attention via packed_seq_params, so no
  # dense mask is needed. Leaving this on also deadlocks TP>1: non-zero TP ranks
  # allocate a receive buffer and wait, while the SFT collator sends
  # attention_mask=None and rank 0's broadcast is a no-op.
  no_create_attention_mask_in_dataloader: true
  qk_layernorm: true
  sequence_parallel: true
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  attention_backend: unfused
  calculate_per_token_loss: true
  no_dsa_kernel_fusion: true
  precision:
    bf16: true
    attention_softmax_in_fp32: true
    accumulate_allreduce_grads_in_fp32: true
  logging:
    log_interval: 1
    tensorboard_log_interval: 1
    log_timers_to_tensorboard: true
    log_throughput: true
    log_memory_to_tensorboard: true
    log_memory_interval: 10
  checkpoint:
    no_save_optim: true
    no_save_rng: true
    save_interval: 100000

model:
  transformer_impl: transformer_engine
  num_layers: 4
  hidden_size: 768
  num_attention_heads: 8
  num_query_groups: 1
  seq_length: 16384
  max_position_embeddings: 16384
  norm_epsilon: 1e-06
  use_rotary_position_embeddings: true
  no_rope_fusion: true
  rotary_base: 10000
  swiglu: true
  normalization: RMSNorm
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  clip_grad: 1.0
  position_embedding_type: rope
  untie_embeddings_and_output_weights: true
  no_position_embedding: true

  # mla args ==================
  multi_latent_attention: true
  kv_lora_rank: 128
  qk_head_dim: 128
  qk_pos_emb_head_dim: 64
  v_head_dim: 128

  # moe args ===================
  ffn_hidden_size: 1024
  moe_ffn_hidden_size: 512
  moe_grouped_gemm: true
  moe_shared_expert_intermediate_size: 512
  num_experts: 32
  moe_router_score_function: sqrtsoftplus
  moe_router_enable_expert_bias: false
  moe_router_bias_update_rate: 0.001
  moe_layer_freq: 1
  moe_router_num_groups: 1
  moe_router_group_topk: 1
  moe_router_topk: 4
  moe_router_topk_scaling_factor: 2.5
  moe_token_dispatcher_type: "alltoall"

  # v4 args ====================
  experimental_attention_variant: "dsv4_hybrid"
  attention_bias: false
  enable_hyper_connections: true
  mhc_init_gating_factor: 1e-06
  num_residual_streams: 4
  mhc_sinkhorn_iterations: 20
  dsa_indexer_head_dim: 128
  dsa_indexer_n_heads: 64
  dsa_indexer_topk: 2
  dsa_indexer_loss_coeff: 0.0
  moe_n_hash_layers: 1
  o_groups: 2
  o_lora_rank: 128
  q_lora_rank: 128
  csa_compress_ratios: "[128]*2+([128]+[4])*1+[128]"
  activation_func_clamp_value: 10.0

  # mtp args
  mtp_num_layers: 1

  # training
  seed: ${experiment.seed}
  micro_batch_size: 1
  global_batch_size: 8
  eval_iters: 0
  train_iters: 5
  eval_interval: 10000

  optimizer:
    clip_grad: 1.0
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    lr_scheduler:
      lr: 1.0e-6
      min_lr: 1.0e-7
      lr_warmup_fraction: 0.05
      lr_decay_style: WSD
      lr_wsd_decay_style: cosine
      lr_wsd_decay_iters: 5

data:
  # ms-swift online SFT data backend (Phase 1). No offline data_path / .bin is
  # used; jsonl is loaded, tokenized and packed at runtime by the swift pipeline.
  sft: true
  sft_data_backend: swift
  sft_model_dir: ${experiment.sft_model_dir}
  sft_model_type: deepseek_v4
  sft_template: deepseek_v4_flash
  sft_dataset: ${experiment.sft_dataset}
  sft_max_length: 16384
  sft_packing_length: 16384
  sft_truncation_strategy: delete
  sft_loss_scale: default+ignore_empty_think
  sft_packing_strategy: binpack
  sft_packing_num_proc: 2
  sft_dataset_num_proc: 4
  tokenizer:
    tokenizer_type: HFTokenizerFS
    tokenizer_path: ${experiment.sft_model_dir}
    vocab_size: 129280
    make_vocab_size_divisible_by: 64
