# DeepSeek-V4-Flash SFT smoke test (single 8-GPU node, random-init weights).
# Drives FlagScale's own Megatron loop with the ms-swift online SFT data
# backend. Launch with:
#   python run.py --config-path examples/deepseek_v4/conf \
#                 --config-name train_dsv4_flash_smoke

defaults:
  - _self_
  - train: dsv4_flash_smoke

experiment:
  exp_name: dsv4-flash-sft-smoke
  seed: 42
  # Provides the tokenizer/processor + template config for the swift backend.
  # Weights are NOT loaded (finetune=true, load=null) -> random init.
  sft_model_dir: /public/lizhiyu/models/DeepSeek-V4-Flash-0731-mini-4l-bf16
  sft_dataset:
    - /public/lizhiyu/data/code/self_evolving/unify_browsecomp/results/collect/ws_processed/0501/validation/valid.jsonl
  save_steps: 100000
  load: null
  exp_dir: /public/lizhiyu/FlagScale/outputs/dsv4_flash_sft_smoke
  ckpt_format: torch
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_deepseek_v4.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    hostfile: null
    nproc_per_node: 8
  cmds:
    # Use the dsv4-train-back conda env for the FlagScale/Megatron/TE stack.
    # The SFT implementation itself is vendored under data/swift.
    before_start: >-
      ulimit -n 1048576 &&
      export PATH=/public/lizhiyu/envs/dsv4-train-back/bin:$PATH &&
      export LD_LIBRARY_PATH=/public/lizhiyu/nccl/build/lib:$LD_LIBRARY_PATH
  envs:
    LOGLEVEL: "INFO"
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    PYTORCH_ALLOC_CONF: "expandable_segments:True"
    SKIP_MULTIMODAL_MTP_VALIDATION: 1
    MEGATRON_DSV4_UNFUSED_ATTN_CHUNK_ROWS: 64
    HF_HOME: /public/lizhiyu/FlagScale/outputs/dsv4_flash_sft_smoke/cache/huggingface
    HF_DATASETS_CACHE: /public/lizhiyu/FlagScale/outputs/dsv4_flash_sft_smoke/cache/datasets

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
