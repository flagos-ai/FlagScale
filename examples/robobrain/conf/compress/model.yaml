system:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  use_flash_attn: True
  sequence_parallel: True
  logging:
    log_interval: 1
    tensorboard_log_interval: 1
    wandb_project: "compress-robobrain2"
    wandb_exp_name: "compress-robobrain2"
  save_dir: RoboBrain2_Compressed


model:
  model_cls: AutoModelForPreTraining
  model_path: /models/RoboBrain2.0-3B
  device_map: cuda:0
  low_cpu_mem_usage: true
  torch_dtype: float16
