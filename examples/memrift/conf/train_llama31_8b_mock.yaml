# Llama-3.1-8B MemRift metric training entry.
# The metric scripts override data_path to Alpaca and can switch between pure LoRA
# and MemRift+LoRA with Hydra overrides.

defaults:
  - train/llama31_8b_lora_memrift_mock
  - _self_

experiment:
  envs:
    TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
  cmds:
    before_start: export TORCH_DEVICE_BACKEND_AUTOLOAD=0
  exp_name: memrift_metric_llama31_8b
  exp_dir: ./outputs/${experiment.exp_name}
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_memrift.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
