defaults:
  - _self_
  - train: 35b_a3b_llm_flash

experiment:
  exp_name: TRAIN-Qwen-36-35B-A3B-LLM-BACKBONE-FLASH
  exp_dir: xxx
  task:
    type: train
    backend: megatron
    entrypoint: ./flagscale/train/megatron/train_qwen35.py
  runner:
    no_shared_fs: false
    per_node_task: false
    rdzv_backend: static
    nnodes: 8
    nproc_per_node: 8
    ssh_port: xxx # use your ssh port
    hostfile: xxx
  cmds:
    before_start: ulimit -n 1048576 && source /root/miniconda3/bin/activate flagscale-train
  envs:
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    # set nccl and gloo configs

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
