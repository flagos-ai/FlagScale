system:
  num_workers: 1
  calculate_per_token_loss: true
  tensor_model_parallel_size: 4 # note: related-to num_query_groups and num_attention_heads
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  expert_model_parallel_size: 2
  # use_flash_attn: True # deprecated, use ```attention_backend: flash```
  use_distributed_optimizer: True
  sequence_parallel: True
  tp_comm_overlap: False # rely on TE support and custom hardware
  overlap_grad_reduce: True # overlap all-reduce with backward propagation
  overlap_param_gather: True # overlap parameter gather with computation
  # use_mcore_models: True # deprecated, mcore models are default
  transformer_impl: transformer_engine
  # use_te: True # deprecated, use ```transformer_impl: transformer_engine```
  precision:
    bf16: True
    attention_softmax_in_fp32: True
    accumulate_allreduce_grads_in_fp32: True
  logging:
    # timing_log_level: 2
    log_interval: 1
    log_throughput: true
    log_params_norm: true
    log_num_zeros_in_grad: true
  checkpoint:
    save_interval: 100
    ckpt_format: torch
    load: xxx/TP4-EP2-CKPT

model:
  finetune: true
  attention_backend: flash
  # Qwen3.6-35B-A3B (MoE) architecture parameters
  kv_channels: 256
  qk_layernorm: True
  disable_bias_linear: True
  num_layers: 40
  hidden_size: 2048
  num_attention_heads: 16
  num_query_groups: 2
  ## sequence length
  seq_length: 32768
  max_padding_length: 32768
  # enable_variable_seq_lengths: True ## disabled, to avoid rebundant pp communication overhead
  max_position_embeddings: 262144 # max length for qwen3.6 rope
  swiglu: True
  normalization: RMSNorm
  norm_epsilon: 1e-6
  init_method_std: 6e-3
  attention_dropout: 0.0
  hidden_dropout: 0.0
  clip_grad: 1.0
  group_query_attention: True
  no_masked_softmax_fusion: True
  untie_embeddings_and_output_weights: True

  # Position embedding: Qwen3.5 uses mRoPE with partial rotary
  position_embedding_type: mrope
  rotary_percent: 0.25
  rotary_base: 1000000
  rotary_seq_len_interpolation_factor: 1
  no_rope_fusion: False
  mrope_section: [11, 11, 10]
  eod_mask_loss: False
  # no_position_embedding: true # deprecated for newest megatron, use 'position_embedding_type' instead

  # Recompute
  recompute:
    recompute_granularity: 'full'
    recompute_method: 'uniform'
    recompute_num_layers: 1

  no_check_for_nan_in_loss_and_grad: true
  seed: 233 # to be checked

  # Gated DeltaNet (GDN) parameters
  experimental_attention_variant: gated_delta_net
  linear_attention_freq: 4
  linear_conv_kernel_dim: 4
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_num_key_heads: 16
  linear_num_value_heads: 32
  layernorm_zero_centered_gamma: True
  attention_output_gate: True

  # MoE parameters
  num_experts: 256
  moe_router_topk: 8
  moe_ffn_hidden_size: 512
  moe_shared_expert_gate: True
  moe_shared_expert_intermediate_size: 512
  moe_router_dtype: fp32
  moe_router_load_balancing_type: global_aux_loss
  moe_router_pre_softmax: False
  moe_grouped_gemm: True
  moe_token_dispatcher_type: alltoall
  moe_permute_fusion: True
  moe_aux_loss_coeff: 1.0e-3

  # training configs
  micro_batch_size: 1
  global_batch_size: 256
  eval_iters: 0
  eval_interval: 1000
  train_samples: 2097152

  optimizer:
    optimizer: adam
    loss_scale: 1.0
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    lr_scheduler:
      lr: 1.0e-5
      min_lr: 1.0e-5
      lr_warmup_samples: 0
      lr_decay_style: constant

  ###### vision related args ######
  no_enable_vision: True  # generates --no-enable-vision; remove this line for multimodal training
  ###### vision related args ######

  ## chunked cross-entropy ##
  chunked_cross_entropy: True
  # cross_entropy_chunk_size: 4096
  cross_entropy_chunk_size: 2048  # optional, default to 4096
  ## chunked cross-entropy ##



# for text only qwen36 llm backbone
data:
  reset_position_ids: True
  reset_attention_mask: True
  no_create_attention_mask_in_dataloader: true
  data_path: xxx
  split: 1
  no_mmap_bin_files: true
  tokenizer:
    tokenizer_type: HFTokenizerFS
    tokenizer_path: models/Qwen3.6-35B-A3B
    vocab_size: 248320 # not used, when building tokenizer, using tokenizer.vocab_size directly, but tokenizer.vocab_size do not include added vocabs
    padded_vocab_size: 248320 # to avoid padding vocab size to ceil(tp*...)
    make_vocab_size_divisible_by: 64
