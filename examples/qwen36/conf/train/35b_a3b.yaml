system:
  num_workers: 1
  calculate_per_token_loss: true
  tensor_model_parallel_size: 2
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  expert_model_parallel_size: 4
  # use_flash_attn: True # deprecated, use ```attention_backend: flash```
  use_distributed_optimizer: True
  sequence_parallel: True
  tp_comm_overlap: False
  overlap_grad_reduce: False
  overlap_param_gather: False
  # use_mcore_models: True # deprecated, mcore models are default
  transformer_impl: transformer_engine
  # use_te: True # deprecated, use ```transformer_impl: transformer_engine```
  precision:
    bf16: True
    attention_softmax_in_fp32: True
    accumulate_allreduce_grads_in_fp32: True
  logging:
    # timing_log_level: 2
    log_interval: 1
    log_throughput: true
    log_params_norm: true
    log_num_zeros_in_grad: true
  checkpoint:
    save_interval: 100
    ckpt_format: torch
    load: /share/project/lixianduo/models/MG-Qwen3.6-35B-A3B

model:
  finetune: true
  # Qwen3.6-35B-A3B (MoE) architecture parameters
  kv_channels: 256
  qk_layernorm: True
  attention_backend: flash
  disable_bias_linear: True
  num_layers: 40
  hidden_size: 2048
  num_attention_heads: 16
  num_query_groups: 2
  seq_length: 2048
  max_padding_length: 2048
  # enable_variable_seq_lengths: True ## disabled, to avoid rebundant pp communication overhead
  max_position_embeddings: 262144
  swiglu: True
  normalization: RMSNorm
  norm_epsilon: 1e-6
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  clip_grad: 1.0
  group_query_attention: True
  no_masked_softmax_fusion: True
  untie_embeddings_and_output_weights: True
  
  # training config
  train_iters: 5000
  eval_iters: 0
  eval_interval: 1000
  micro_batch_size: 1
  global_batch_size: 4
  
  # Position embedding: Qwen3.5 uses mRoPE with partial rotary
  position_embedding_type: mrope
  rotary_percent: 0.25
  rotary_base: 10000000
  rotary_seq_len_interpolation_factor: 1
  no_rope_fusion: False
  mrope_section: [11, 11, 10]
  eod_mask_loss: False

  # mtp
  mtp_num_layers: 1

  # Recompute
  recompute:
    recompute_granularity: 'full'
    recompute_method: 'uniform'
    recompute_num_layers: 1

  seed: 42

  # Gated DeltaNet (GDN) parameters
  experimental_attention_variant: gated_delta_net
  linear_attention_freq: 4
  linear_conv_kernel_dim: 4
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_num_key_heads: 16
  linear_num_value_heads: 32
  layernorm_zero_centered_gamma: True
  attention_output_gate: True

  # MoE parameters
  num_experts: 256
  moe_router_topk: 8
  moe_ffn_hidden_size: 512
  moe_shared_expert_gate: True
  moe_shared_expert_intermediate_size: 512
  moe_router_dtype: fp32
  moe_router_load_balancing_type: global_aux_loss
  moe_router_pre_softmax: False
  moe_grouped_gemm: True
  moe_token_dispatcher_type: alltoall
  moe_permute_fusion: True
  moe_aux_loss_coeff: 1.0e-3

  optimizer:
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.999
    lr_scheduler:
      lr: 5.0e-6
      min_lr: 5.0e-7
      lr_warmup_fraction: .03
      lr_decay_style: cosine
    
  ###### vision related args ######
  vision_ration: 0.1
  allow_missing_vision_projection_checkpoint: False
  patch_size: 16
  freeze_LM: False
  freeze_ViT: False
  disable_vision_class_token: True
  vision_recompute_activations: True
  vision_num_layers: 27
  vision_hidden_size: 1152
  vision_ffn_hidden_size: 4304
  vision_num_attention_heads: 16
  ###### vision related args ######


# # for multimodal qwen36
data:
  no_use_system_prompt: True
  vocab_size: 248320
  data_path: /share/project/lixianduo/data/qwen35/llava-datasets/blip_laion_cc_sbu_558k/wds-1/
  vision_root: /share/project/lixianduo/data/qwen35/llava-datasets/
  dataloader_type: external
  split: 100,0,0
  tokenizer:
    tokenizer_type: Qwen2VLTokenizer
    tokenizer_path: /share/project/lixianduo/data/qwen35/qwen2vl_tokenizer
    extra_vocab_size: 0
    make_vocab_size_divisible_by: 64