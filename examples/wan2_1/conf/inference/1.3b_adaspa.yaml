engine:
  model: /workspace/models/Wan2.1-T2V-1.3B-Diffusers
  loader: diffusers
  pipeline:
    class: diffusers.WanPipeline
    from_pretrained:
      torch_dtype: bfloat16
  components:
    vae:
      class: diffusers.AutoencoderKLWan
      from_pretrained:
        subfolder: vae
        torch_dtype: float32
  device: cuda
  results_path: ${experiment.exp_dir}/results
  output_format: "video"
  transformations:
    AdaSpaTransformation:
      strict: true
      basic:
        model_id: Wan2.1
        prompt: "A cat walks on the grass, realistic"
        height: 480
        width: 832
        frames: 81
        num_steps: 50
        seed: 42
        fps: 15
      adaspa:
        enable_log: true
        num_layers: 30
        sparsity: 0.9
        search_steps: [0, 30]
        min_recall: 0.9
        block_size: 128
        sparsity_modes:
          - random_select
          - head_adaptive
          - cache_lse
          - row_wise
          - text_sink
          - first_frame_sink
    TimestepTrackerTransformation:
      {}
    StateScopeTransformation:
      {}
  state_scopes:
    ["cond", "uncond"]

generate:
  prompts: ["A cat walks on the grass, realistic"]
  negative_prompt: "Bright tones, overexposed, static, blurred details, subtitles, style, works, paintings, images, static, overall gray, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn faces, deformed, disfigured, misshapen limbs, fused fingers, still picture, messy background, three legs, many people in the background, walking backwards"
  height: 480
  width: 832
  num_frames: 81
  guidance_scale: 5.0
  generator:
    seed: 42
    device: cuda
