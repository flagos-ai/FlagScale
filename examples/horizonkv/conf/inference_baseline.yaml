defaults:
  - _self_
  - inference: ar_diffusion_baseline

experiment:
  exp_name: ar_diffusion_baseline
  exp_dir: outputs/${experiment.exp_name}
  model: ${oc.env:HORIZONKV_ASSETS,./models/horizonkv}
  task:
    type: inference
    backend: vllm
    entrypoint: flagscale/inference/core/inference_diffusion.py
  runner:
    hostfile: null
  cmds:
    before_start: source ${oc.env:HORIZONKV_ENV,./.venvs/horizonkv-worker}/bin/activate
  envs:
    CUDA_VISIBLE_DEVICES: ${oc.env:HORIZONKV_GPU,0}
    PYTHONDONTWRITEBYTECODE: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
