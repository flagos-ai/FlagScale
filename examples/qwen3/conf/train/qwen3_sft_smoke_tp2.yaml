# Single-node SFT smoke test for a small Qwen3 (dense) model using the ms-swift
# online data backend. The model is randomly initialised: this run exercises the
# SFT DATA PATH (load -> template tokenize with loss_scale -> packing -> collate
# -> forward/backward) via the generic train_gpt.py loop, NOT convergence.
#
# Qwen3 uses standard dense GQA attention (no MLA / no CSA), so unlike the
# DeepSeek-V4 smoke test it does not hit the CSA packing wall in Megatron-LM-FL.
# Real tokenizer + template come from experiment.sft_model_dir (Qwen3-4B).

system:
  no_shared_fs: ${experiment.runner.no_shared_fs}
  num_workers: 4
  tensor_model_parallel_size: 2
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  finetune: true
  no_load_rng: true
  no_load_optim: true
  disable_bias_linear: true
  reset_position_ids: true
  reset_attention_mask: true
  # Packed sequences use varlen (THD) attention via packed_seq_params, so no
  # dense mask is needed. Leaving this on also deadlocks TP>1: non-zero TP ranks
  # allocate a receive buffer and wait, while the SFT collator sends
  # attention_mask=None and rank 0's broadcast is a no-op.
  no_create_attention_mask_in_dataloader: true
  qk_layernorm: true
  sequence_parallel: true
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  precision:
    bf16: true
    attention_softmax_in_fp32: true
    accumulate_allreduce_grads_in_fp32: true
  logging:
    log_interval: 1
    tensorboard_log_interval: 1
    log_timers_to_tensorboard: true
    log_throughput: true
  checkpoint:
    no_save_optim: true
    no_save_rng: true
    save_interval: 100000

model:
  transformer_impl: transformer_engine
  # Keep TE's fused attention (flash/cuDNN). unfused does NOT support packing.
  attention_backend: flash
  # Small random-init Qwen3 dense arch (fits one node, fast). Swap in the real
  # Qwen3-4B dims (36 layers / hidden 2560 / 32 heads / 8 kv / ffn 9728) once the
  # data path is validated.
  num_layers: 4
  hidden_size: 1024
  ffn_hidden_size: 3072
  kv_channels: 128
  num_attention_heads: 16
  group_query_attention: true
  num_query_groups: 8
  seq_length: 16384
  max_position_embeddings: 40960
  norm_epsilon: 1e-6
  use_rotary_position_embeddings: true
  rotary_base: 1000000
  swiglu: true
  normalization: RMSNorm
  qk_layernorm: true
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  clip_grad: 1.0
  position_embedding_type: rope
  untie_embeddings_and_output_weights: false
  no_position_embedding: true
  no_rope_fusion: true

  # training
  seed: ${experiment.seed}
  micro_batch_size: 1
  global_batch_size: 8
  eval_iters: 0
  eval_interval: 10000
  train_iters: 5

  optimizer:
    clip_grad: 1.0
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    lr_scheduler:
      lr: 1.0e-6
      min_lr: 1.0e-7
      lr_warmup_fraction: 0.05
      lr_decay_style: WSD
      lr_wsd_decay_style: cosine
      lr_wsd_decay_iters: 5

data:
  # ms-swift online SFT data backend (Phase 1). No offline data_path / .bin is
  # used; jsonl is loaded, tokenized and packed at runtime by the swift pipeline.
  sft: true
  sft_data_backend: swift
  sft_model_dir: ${experiment.sft_model_dir}
  sft_model_type: qwen3
  sft_template: qwen3
  sft_dataset: ${experiment.sft_dataset}
  sft_max_length: 16384
  sft_packing_length: 16384
  sft_truncation_strategy: delete
  sft_loss_scale: default
  sft_packing_strategy: binpack
  sft_packing_num_proc: 2
  sft_dataset_num_proc: 4
  tokenizer:
    tokenizer_type: HFTokenizerFS
    tokenizer_path: ${experiment.sft_model_dir}
    vocab_size: 151936
    make_vocab_size_divisible_by: 64
