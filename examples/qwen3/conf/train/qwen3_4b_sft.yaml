# Single-node SFT hot-start for Qwen3-4B (dense) using the ms-swift online data
# backend. Dimensions below are copied from Qwen3-4B config.json:
#   36 layers / hidden 2560 / 32 heads / 8 kv heads (head_dim 128) / ffn 9728 /
#   vocab 151936 / rope theta 1e6 / max_position 40960 / tie_word_embeddings.
# Weights come from the mcore conversion of the HF checkpoint (experiment.load),
# not random init: the smoke test (train/qwen3_sft_smoke.yaml) already validated
# the SFT DATA PATH; this config aligns the MODEL to the real 4B.

system:
  no_shared_fs: ${experiment.runner.no_shared_fs}
  num_workers: 4
  # TP=2: obs on TP=1 show optimizer state kept FULL per rank (~72GiB static: master+m+v
  # unsharded despite DP=8, DistributedOptimizer in classic mode) → OOM at layer0 fwd.
  # TP=2 halves the per-rank model+optimizer footprint either way.
  tensor_model_parallel_size: 2
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  finetune: true
  no_load_rng: true
  no_load_optim: true
  disable_bias_linear: true
  reset_position_ids: true
  reset_attention_mask: true
  # packed SFT never materializes an attention_mask (cu_seqlens path); leaving the
  # dataloader flag on makes TP-receiver ranks allocate (1,1,seq,seq) masks and wait
  # for a broadcast the sender (attention_mask=None) never issues → NCCL deadlock
  no_create_attention_mask_in_dataloader: true
  qk_layernorm: true
  sequence_parallel: false
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  # OOM fix: seq16384×36L activations don't fit H100 80G without recompute
  recompute_method: uniform
  recompute_granularity: full
  recompute_num_layers: 36  # full granularity requires 1..num_layers_per_pp_rank(36)
  # OOM fix#2: logits [16384,151936] fp32 ~10G → chunked CE (same as qwen36 35b example)
  chunked_cross_entropy: true
  cross_entropy_chunk_size: 2048
  precision:
    bf16: true
    attention_softmax_in_fp32: true
    accumulate_allreduce_grads_in_fp32: true
  logging:
    log_interval: 1
    tensorboard_log_interval: 1
    log_timers_to_tensorboard: true
    log_throughput: true
  checkpoint:
    no_save_optim: true
    no_save_rng: true
    save_interval: 100000
    load: ${experiment.load}
    ckpt_format: ${experiment.ckpt_format}

  profile: true
  use_pytorch_profiler: true
  # profile_ranks: [0] # 全局 rank；空列表表示所有 rank
  profile_step_start: 2
  profile_step_end: 4
  pytorch_profiler_collect_shapes: true
  pytorch_profiler_collect_memory: false
  pytorch_profiler_collect_callstack: false

model:
  transformer_impl: transformer_engine
  # Keep TE's fused attention (flash/cuDNN). unfused does NOT support packing.
  attention_backend: flash
  # Qwen3-4B dense arch (from /public-nvme/lizhiyu/Qwen/Qwen3-4B/config.json).
  num_layers: 36
  hidden_size: 2560
  ffn_hidden_size: 9728
  kv_channels: 128
  num_attention_heads: 32
  group_query_attention: true
  num_query_groups: 8
  seq_length: 16384
  max_position_embeddings: 40960
  norm_epsilon: 1e-6
  use_rotary_position_embeddings: true
  rotary_base: 1000000
  swiglu: true
  normalization: RMSNorm
  qk_layernorm: true
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  clip_grad: 1.0
  position_embedding_type: rope
  untie_embeddings_and_output_weights: false
  no_position_embedding: true
  no_rope_fusion: true

  # training
  seed: ${experiment.seed}
  micro_batch_size: 1
  global_batch_size: 8
  eval_iters: 0
  eval_interval: 10000
  # 47 packs / DP-8 ≈ 6 micro-batches per rank per epoch; mbs=1 gbs=8 consumes 1
  # micro-batch/rank/iter → 5 iters × 8 = 40 ≤ 47 (launch#11: 10 iters → StopIteration)
  train_iters: 5

  optimizer:
    clip_grad: 1.0
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    lr_scheduler:
      lr: 1.0e-5
      min_lr: 1.0e-6
      lr_warmup_fraction: 0.05
      lr_decay_style: WSD
      lr_wsd_decay_style: cosine
      lr_wsd_decay_iters: 10

data:
  # ms-swift online SFT data backend. No offline data_path / .bin is used;
  # jsonl is loaded, tokenized and packed at runtime by the swift pipeline.
  sft: true
  sft_data_backend: swift
  sft_model_dir: ${experiment.sft_model_dir}
  sft_model_type: qwen3
  sft_template: qwen3
  sft_dataset: ${experiment.sft_dataset}
  sft_max_length: 16384
  sft_packing_length: 16384
  sft_truncation_strategy: delete
  sft_loss_scale: default
  sft_packing_strategy: binpack
  sft_packing_num_proc: 2
  sft_dataset_num_proc: 4
  tokenizer:
    tokenizer_type: HFTokenizerFS
    tokenizer_path: ${experiment.sft_model_dir}
    vocab_size: 151936
    padded_vocab_size: 151936  # Qwen3 ckpt embedding rows > tokenizer len(151669); tokenizer.py only auto-pads tokenizer vocab when padded_vocab_size is None
    make_vocab_size_divisible_by: 64
