#
# Qwen3 (dense) SFT smoke test (single 8-GPU node, random-init weights).
# Drives FlagScale's own Megatron loop (generic train_gpt.py) with the ms-swift
# online SFT data backend. Used to validate the SFT DATA PIPELINE independent of
# the DeepSeek-V4 CSA attention (which does not yet support packing in
# Megatron-LM-FL). Launch with:
#   python run.py --config-path examples/qwen3/conf \
#                 --config-name train_qwen3_sft_smoke

defaults:
  - _self_
  - train: qwen3_sft_smoke_tp2

experiment:
  exp_name: qwen3-sft-smoke-tp2
  seed: 42
  # Provides the tokenizer/processor + template config for the swift backend.
  # Weights are NOT loaded (finetune=true, load=null) -> random init.
  sft_model_dir: /public-nvme/lizhiyu/Qwen/Qwen3-4B
  sft_dataset:
    - /public/lizhiyu/data/code/self_evolving/unify_browsecomp/results/collect/ws_processed/0501/validation/valid.jsonl
  save_steps: 100000
  load: null
  exp_dir: /public/lizhiyu/FlagScale/outputs/qwen3_sft_smoke_tp2
  ckpt_format: torch
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    hostfile: null
    nproc_per_node: 8
  cmds:
    # Use the dsv4-train-back conda env: it has the full FlagScale/Megatron/TE
    # stack PLUS the swift library the SFT data backend imports.
    before_start: >-
      ulimit -n 1048576 &&
      export PATH=/public/lizhiyu/envs/dsv4-train-back/bin:$PATH &&
      export LD_LIBRARY_PATH=/public/lizhiyu/nccl/build/lib:$LD_LIBRARY_PATH
  envs:
    LOGLEVEL: "INFO"
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    PYTORCH_ALLOC_CONF: "expandable_segments:True"
    CUDA_LAUNCH_BLOCKING: 1
    NVTE_DEBUG: 1
    NVTE_DEBUG_LEVEL: 2
    HF_HOME: /public/lizhiyu/FlagScale/outputs/qwen3_sft_smoke_tp2/cache/huggingface
    HF_DATASETS_CACHE: /public/lizhiyu/FlagScale/outputs/qwen3_sft_smoke_tp2/cache/datasets

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
