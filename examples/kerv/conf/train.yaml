# Select verifier_lora, verifier_full, or drafter with KERV_TRAIN_STAGE.
defaults:
  - _self_
  - train: ${oc.env:KERV_TRAIN_STAGE,verifier_lora}

experiment:
  exp_name: kerv_${train.kerv.stage}
  exp_dir: outputs/${experiment.exp_name}
  task:
    type: train
    backend: native
    entrypoint: flagscale/train/train_kerv.py
  runner:
    hostfile: null
    nproc_per_node: ${train.resources.nproc_per_node}
    rdzv_backend: static
  envs:
    CUDA_VISIBLE_DEVICES: ${train.resources.cuda_visible_devices}
    WANDB_MODE: ${oc.env:WANDB_MODE,offline}

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
