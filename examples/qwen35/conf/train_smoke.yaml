# Full Qwen/Qwen3.5-4B image-text training, including auxiliary MTP.
# Set QWEN35_HF_PATH, QWEN35_DATA_PATH and QWEN35_LOAD before launching.
defaults:
  - train
  - _self_

experiment:
  exp_name: qwen35_4b_smoke
  exp_dir: ${oc.env:QWEN35_OUTPUT_DIR,./outputs/qwen35_4b_smoke}
  runner:
    nproc_per_node: 2
  envs:
    CUDA_VISIBLE_DEVICES: ${oc.env:QWEN35_VISIBLE_DEVICES,"0,1"}

train:
  system:
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    num_workers: 1
    logging:
      log_throughput: true
    use_checkpoint_opt_param_scheduler: true
    dataloader_save: ${experiment.exp_dir}/dataloader
    checkpoint:
      load: ${oc.env:QWEN35_LOAD}
      save: ${experiment.exp_dir}/checkpoints
      save_interval: 2
  model:
    seq_length: 512
    max_padding_length: 512
    image_max_pixels: 16384
    image_min_pixels: 1024
    train_iters: ${oc.env:QWEN35_TRAIN_ITERS,4}
    global_batch_size: 2
    eval_iters: 0
  data:
    data_path: ${oc.env:QWEN35_DATA_PATH}
    vision_root: ${oc.env:QWEN35_VISION_ROOT}
    tokenizer:
      tokenizer_path: ${oc.env:QWEN35_HF_PATH}
