# Qwen3.5 non-colocated grid MIMO (world 8, images ranks [0,2), language [2,8)).
#
# Preset layout: Vision TP2/DP1 (images ranks [0,2)) + Language TP1/PP1/DP6
# (ranks [2,8)); any spec inside the validator's predicate boundary works.
# Batch contract: micro_batch_size (6) divisible by every module DP (1, 6);
# global_batch_size = micro_batch_size * num_microbatches (grid mode runs the
# num-microbatches calculator with data_parallel_size == 1).  With the legacy
# parallel sizes at their defaults (1), the parse-time derived data parallel
# size is world / (1*1*1) = 8 and 48 % (6 * 8) == 0.
#
# The global parallel state runs with TP=1/PP=1/DP=1 in grid mode; the
# per-module layouts come from `mimo_module_specs`.  Legacy parallel sizes
# must stay at their defaults (1 / None) — the parse-time contract fail-fasts
# otherwise.  `sequence_parallel: True` records user intent only (carried via
# mimo_sequence_parallel); the grid path resolves SP per module, currently
# disabled for both.

system:
  use_mimo: true
  mimo_layout: grid
  mimo_module_specs: "images=tp=2,dp=1; language=tp=1,pp=1,dp=6,rank_offset=2"

  num_workers: 1
  calculate_per_token_loss: true
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  use_flash_attn: True
  use_distributed_optimizer: True
  sequence_parallel: True  # intent only; resolved per module via mimo_sequence_parallel
  tp_comm_overlap: False
  overlap_grad_reduce: False
  overlap_param_gather: False
  use_mcore_models: True
  transformer_impl: transformer_engine
  use_te: True
  precision:
    bf16: True
    attention_softmax_in_fp32: True
  logging:
    log_interval: 1
  checkpoint:
    save_interval: 10000
    # The grid path saves/loads via MCore sharded state dicts (MimoModel /
    # MimoOptimizer); torch_dist is mandatory (fail-fast otherwise).
    ckpt_format: torch_dist

model:
  # Qwen3.5-4B architecture parameters
  kv_channels: 256
  qk_layernorm: True
  attention_backend: flash
  disable_bias_linear: True
  num_layers: 32
  hidden_size: 2560
  ffn_hidden_size: 9216
  num_attention_heads: 16
  num_query_groups: 4
  seq_length: 2048
  max_padding_length: 2048
  enable_variable_seq_lengths: True
  max_position_embeddings: 262144
  swiglu: True
  normalization: RMSNorm
  norm_epsilon: 1e-6
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  clip_grad: 1.0
  train_iters: 5000
  eval_iters: 0
  eval_interval: 1000
  # Grid batch contract: micro_batch_size must be divisible by every module's
  # DP (6 for the language module here); global_batch_size =
  # micro_batch_size * num_microbatches (8 microbatches below).
  micro_batch_size: 6
  global_batch_size: 48
  allow_missing_vision_projection_checkpoint: False
  apply_layernorm_1p: False
  group_query_attention: True
  no_masked_softmax_fusion: True
  untie_embeddings_and_output_weights: False

  # Position embedding: Qwen3.5 uses mRoPE with partial rotary
  position_embedding_type: mrope
  rotary_percent: 0.25
  rotary_base: 10000000
  rotary_seq_len_interpolation_factor: 1
  no_rope_fusion: False
  mrope_section: [11, 11, 10]
  eod_mask_loss: False

  # Vision model
  patch_size: 16
  freeze_LM: False
  freeze_ViT: False
  disable_vision_class_token: True

  # mtp (disabled for the grid path in this stage: the MCore MimoModel does
  # not forward loss_mask into the language forward, so MTP loss is unsupported)
  mtp_num_layers: 0

  # Recompute
  vision_recompute_activations: True
  recompute:
    recompute_granularity: 'full'
    recompute_method: 'uniform'
    recompute_num_layers: 1

  seed: 42

  # Gated DeltaNet (GDN) parameters
  experimental_attention_variant: gated_delta_net
  linear_attention_freq: 4
  linear_conv_kernel_dim: 4
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_num_key_heads: 16
  linear_num_value_heads: 32
  layernorm_zero_centered_gamma: True
  attention_output_gate: True

  # Vision encoder parameters
  vision_num_layers: 24
  vision_hidden_size: 1024
  vision_ffn_hidden_size: 4096
  vision_num_attention_heads: 16

  optimizer:
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.999
    lr_scheduler:
      lr: 1.0e-5
      min_lr: 1.0e-6
      lr_warmup_fraction: .03
      lr_decay_style: cosine

data:
  no_use_system_prompt: True
  vocab_size: 248320
  data_path: /workspace/data/qwen/qwen_wds/wds-1
  vision_root: /
  dataloader_type: external
  split: 100,0,0
  tokenizer:
    tokenizer_type: Qwen2VLTokenizer
    tokenizer_path: /workspace/data/qwen/qwen2vl_tokenizer
    extra_vocab_size: 0
    make_vocab_size_divisible_by: 64
