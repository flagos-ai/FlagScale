- serve_id: vllm_model
  engine_args:
    host: 0.0.0.0
    port: 5000
    model_variant: "pi0.5"
    model: /share/project/fengyupu/github/FlagScale_2/outputs/260322_pi0_5_train_new_lerobot/checkpoints/last/pretrained_model
    device: "cuda"
    # Maps client-sent observation keys to the keys the model was trained with.
    # Format: {key_from_client: key_expected_by_model}
    rename_map:
      "observation/image": "observation.images.image"
      "observation/wrist_image": "observation.images.wrist_image"
      "observation/state": "observation.state"
      "prompt": "task"
