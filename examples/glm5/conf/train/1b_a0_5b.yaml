system:
  no_shared_fs: ${experiment.runner.no_shared_fs}
  num_workers: 2
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  context_parallel_size: 1
  sequence_parallel: true
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  # overlap_moe_expert_parallel_comm: true
  precision:
    bf16: true
    attention_softmax_in_fp32: true
    accumulate_allreduce_grads_in_fp32: true
  logging:
    log_interval: 1
    tensorboard_log_interval: 1
    wandb_project: ${experiment.exp_name}
    wandb_exp_name: ${experiment.exp_name}
    log_timers_to_tensorboard: true
    log_validation_ppl_to_tensorboard: true
    log_throughput: true
    log_params_norm: true
    log_num_zeros_in_grad: true
    log_memory_to_tensorboard: true
  checkpoint:
    save_interval: 1000
    # pretrained_checkpoint: /nfs/lizhiyu/data/zai-org/glm5.2-small-dummy-mc
    load: ${experiment.load}
    ckpt_format: ${experiment.ckpt_format}
  profiler:
    profile: False
    use_pytorch_profiler: False
    pytorch_profiler_collect_shapes: False
    pytorch_profiler_collect_callstack: False
    pytorch_profiler_collect_chakra: False
    profile_step_start: 2
    profile_step_end: 4


model:
  # flagos
  te_fl_prefer: flagos
  enable_flag_gems: True
  flag_gems_log_path: /nfs/lizhiyu/kt2/ds-fl/gems.log
  flag_gems_unused: ["baddbmm", "mm", "normal_", "sum_dim", "gather_backward", "index_add_", "slice_backward"]
  attention_backend: unfused
  distributed_backend: flagcx
  # common
  transformer_impl: transformer_engine
  num_layers: 12
  hidden_size: 768 #6144 / 8 = 768
  num_attention_heads: 8
  num_query_groups: 8
  seq_length: 4096
  max_position_embeddings: 4096
  norm_epsilon: 1e-5
  use_rotary_position_embeddings: true
  rotary_base: 1000000
  no_rope_fusion: true
  swiglu: true
  normalization: RMSNorm
  qk_layernorm: true
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  position_embedding_type: rope
  untie_embeddings_and_output_weights: true
  no_position_embedding: true
  disable_bias_linear: true

  # MLA args
  multi_latent_attention: true
  q_lora_rank: 2048
  kv_lora_rank: 512
  qk_head_dim: 192
  qk_pos_emb_head_dim: 64
  v_head_dim: 256

  # DSA args (all layers use DSA)
  experimental_attention_variant: dsa
  dsa_indexer_n_heads: 32
  dsa_indexer_head_dim: 128
  dsa_indexer_topk: 2048
  dsa_indexer_loss_coeff: 0.01
  indexer_type_rule: "3*full+repeat(full, shared, shared)" #GLM5/GLM5.1 is None

  # MoE args
  ffn_hidden_size: 2048
  moe_ffn_hidden_size: 1024
  moe_grouped_gemm: true
  moe_shared_expert_intermediate_size: 1024
  num_experts: 16
  moe_router_load_balancing_type: "none"
  moe_router_score_function: sigmoid
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: 0.001
  moe_aux_loss_coeff: 0.0
  moe_layer_freq: "[0]*3+[1]*9"
  moe_router_num_groups: 1
  moe_router_group_topk: 1
  moe_router_topk: 2
  moe_router_topk_scaling_factor: 2.5
  moe_token_dispatcher_type: "alltoall"

  # MTP args
  mtp_num_layers: 0
  mtp_loss_scaling_factor: 0.3

  # Training
  seed: ${experiment.seed}
  finetune: false
  micro_batch_size: 1
  global_batch_size: 128
  eval_iters: 0
  eval_interval: 100
  train_iters: 1024

  optimizer:
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.999
    lr_scheduler:
      lr: 1.0e-5
      min_lr: 1.0e-6
      lr_warmup_fraction: .03
      # lr_warmup_iters: 10
      lr_decay_style: cosine
  profiler:
    profile: true
    profile_step_start: 2
    profile_step_end: 3
    use_pytorch_profiler: False
    pytorch_profiler_collect_shapes: False
    pytorch_profiler_collect_callstack: True
    pytorch_profiler_collect_chakra: False
data:
  reset_position_ids: true
  reset_attention_mask: true
  data_path: /nfs/lizhiyu/data/pile_wikipedia_demo
  split: 1
  no_mmap_bin_files: true
  tokenizer:
    tokenizer_type: HuggingFaceTokenizer
    # tokenizer_path: /share/project/lizhiyu/data/GLM-5/
    tokenizer_model: /nfs/lizhiyu/data/zai-org/GLM-5/
    vocab_size: 154880
    make_vocab_size_divisible_by: 64
