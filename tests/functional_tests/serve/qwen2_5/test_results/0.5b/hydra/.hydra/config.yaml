experiment:
  exp_name: qwen2_5
  exp_dir: tests/functional_tests/serve/qwen2_5/test_results/0.5b
  task:
    type: serve
    entrypoint: null
  runner:
    hostfile: null
    deploy:
      port: 6703
      use_fs_serve: false
  envs:
    CUDA_VISIBLE_DEVICES: 0
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    no_proxy: 127.0.0.1,localhost
  cmds:
    before_start: ulimit -n 65535 && source /root/miniconda3/bin/activate flagscale-inference
action: test
serve:
- serve_id: vllm_model
  engine: vllm
  engine_args:
    model: /home/gitlab-runner/data/Qwen2.5-0.5B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    gpu_memory_utilization: 0.9
    max_model_len: 32768
    max_num_seqs: 256
    enforce_eager: true
    trust_remote_code: true
    enable_chunked_prefill: true
