defaults:
  - _self_
  - inference: 4b_tp2_musa

experiment:
  exp_name: qwen3
  exp_dir: tests/functional_tests/inference/qwen3/test_results/4b_tp2_musa
  task:
    type: inference
    backend: vllm
    entrypoint: flagscale/inference/inference_llm.py
  runner:
    hostfile: null
  cmds:
    before_start: ''
  envs:
    HYDRA_FULL_ERROR: 1
    FS_PLATFORM: musa
    TORCHDYNAMO_DISABLE: 1
    TORCH_COMPILE_DISABLE: 1
    USE_FLAGGEMS: "false"
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    MUSA_VISIBLE_DEVICES: "0,1"
    MTHREADS_VISIBLE_DEVICES: all
    MTHREADS_DRIVER_CAPABILITIES: all
    OMP_NUM_THREADS: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
