experiment:
  exp_name: tp4_pp2
  exp_dir: tests/functional_tests/train/aquila/gold_values/tp4_pp2
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    ssh_port: null
  shell_cmds: null
  envs:
    HYDRA_FULL_ERROR: 1
    CUDA_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    CUBLAS_WORKSPACE_CONFIG: :4096:8
    NCCL_ALGO: Ring
    NVTE_APPLY_QK_LAYER_SCALING: 0
    NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
    NVTE_FLASH_ATTN: 0
    NVTE_FUSED_ATTN: 0
    CUDNN_BENCHMARK: 'false'
    CUDNN_DETERMINISTIC: 'true'
  cmds:
    before_start: source /root/miniconda3/bin/activate ayl-train
action: test
train:
  data:
    data_path: /share/project/ayl/test_data/pile_wikipedia_demo
    split: 1
    tokenizer:
      legacy_tokenizer: true
      tokenizer_type: AquilaTokenizerFS
      vocab_file: ./examples/aquila/tokenizer/vocab.json
      merge_file: ./examples/aquila/tokenizer/merges.txt
      special_tokens_file: ./examples/aquila/tokenizer/special_tokens.txt
      vocab_size: 100008
  system:
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 2
    disable_bias_linear: true
    use_distributed_optimizer: true
    precision:
      fp16: true
      initial_loss_scale: 522893
      min_loss_scale: 1.0
      attention_softmax_in_fp32: true
      accumulate_allreduce_grads_in_fp32: true
    logging:
      log_interval: 1
      no_log_loss_scale_to_tensorboard: true
    checkpoint:
      no_save_optim: true
      no_save_rng: true
      save_interval: 100000
      tensorboard_log_interval: 999999
  model:
    attention_backend: unfused
    deterministic_mode: true
    use_mcore_models: true
    transformer_impl: transformer_engine
    num_layers: 4
    hidden_size: 512
    num_attention_heads: 8
    seq_length: 1024
    max_position_embeddings: 1024
    norm_epsilon: 1.0e-05
    use_rotary_position_embeddings: true
    no_position_embedding: true
    swiglu: true
    multiple_of: 256
    normalization: RMSNorm
    untie_embeddings_and_output_weights: true
    init_method_std: 0.02
    attention_dropout: 0.0
    hidden_dropout: 0.0
    weight_decay: 0.1
    clip_grad: 1.0
    train_iters: 10
    micro_batch_size: 4
    global_batch_size: 1024
    seed: 42
    optimizer:
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 2.0e-05
        min_lr: 2.0e-06
        lr_warmup_samples: 0
        lr_warmup_fraction: 0.01
        lr_decay_style: cosine
