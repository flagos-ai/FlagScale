defaults:
  - _self_
  - train: 0_6b_hygon

experiment:
  exp_name: 0_6b_hygon
  exp_dir: tests/functional_tests/train/qwen3/test_results/0_6b_hygon
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    backend: torchrun
    nnodes: 1
    nproc_per_node: 1
    rdzv_backend: static
    no_shared_fs: false
  shell_cmds: null
  envs:
    HYDRA_FULL_ERROR: 1
    CUDA_VISIBLE_DEVICES: "0"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    # Override the base image's vendor-specific setting with an algorithm
    # accepted by the DTK NCCL compatibility layer on BW1000.
    NCCL_ALGO: "Ring"
    # Megatron deterministic mode requires Transformer Engine to reject
    # nondeterministic attention implementations.
    NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
    TORCHINDUCTOR_WORKER_START: spawn
  cmds:
    before_start: ulimit -n 1048576
action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
