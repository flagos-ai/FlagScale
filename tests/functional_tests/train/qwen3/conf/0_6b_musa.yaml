defaults:
  - _self_
  - train: 0_6b_musa

experiment:
  exp_name: 0_6b_musa
  exp_dir: tests/functional_tests/train/qwen3/test_results/0_6b_musa
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    backend: torchrun
    nnodes: 1
    nproc_per_node: 1
    rdzv_backend: static
    no_shared_fs: false
  shell_cmds: null
  envs:
    HYDRA_FULL_ERROR: 1
    FS_PLATFORM: musa
    MG_FL_PREFER: musa
    TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: 1
    # The pinned S5000 TransformerEngine build is validated in eager mode.
    # Disable torch/TE compilation to avoid unsupported Triton lowering paths.
    TORCHDYNAMO_DISABLE: 1
    TORCH_COMPILE_DISABLE: 1
    NVTE_TORCH_COMPILE: 0
    NVTE_FLASH_ATTN: 1
    NVTE_FUSED_ATTN: 0
    NVTE_UNFUSED_ATTN: 0
    ACCELERATOR_BACKEND: musa
    MUSA_VISIBLE_DEVICES: "0"
    MTHREADS_VISIBLE_DEVICES: all
    MTHREADS_DRIVER_CAPABILITIES: all
  cmds:
    before_start: ''

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
