defaults:
  - _self_
  - train: ppu0_6b_tp1_pp1-reference
experiment:
  exp_name: ppu0_6b_tp1_pp1-reference
  exp_dir: tests/functional_tests/benchmark/qwen3/test_results/ppu0_6b_tp1_pp1-reference
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_gpt.py
  runner:
    backend: torchrun
    nnodes: 1
    nproc_per_node: 1
    rdzv_backend: static
    no_shared_fs: false
    ssh_port: null
  shell_cmds: null
  envs:
    HYDRA_FULL_ERROR: 1
    CUDA_VISIBLE_DEVICES: "0"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    NCCL_ALGO: Ring
    NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
    NVTE_FLASH_ATTN: 0
    NVTE_FUSED_ATTN: 0
    NVTE_UNFUSED_ATTN: 1
  cmds:
    before_start: ''
action: run
hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
