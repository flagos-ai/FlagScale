device_types:
  - bw1000

bw1000:
  name: "bw1000"
  tests:
    functional:
      train:
        qwen3: ["0_6b_hygon"]
      hetero_train: {}
      benchmark: {}
      inference:
        qwen3: ["4b_tp2_hygon"]
      serve:
        qwen3: ["4b_tp2_hygon"]
    unit:
      nproc_per_node: 1
      include: "*"
      exclude:
        # This test defines an eight-rank heterogeneous mesh; it is not a single-rank unit test.
        - tests/unit_tests/test_parallel_context.py::test_parallel_config
        # This distributed-only case requires world_size to be divisible by two.
        - tests/unit_tests/test_spiky_loss_detector.py
