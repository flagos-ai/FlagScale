device_types: [iluvatar]
iluvatar:
  name: iluvatar
  tests:
    functional:
      train:
        qwen3: [0_6b_iluvatar]
    unit:
      nproc_per_node: 2
      include: "*"
      exclude:
        # VLA tests require a separate multimodal dependency stack that is not
        # part of the Iluvatar Qwen3 training image.
        - tests/unit_tests/models/vla
        # This test builds a logical mesh larger than the two-rank Iluvatar CI job.
        - tests/unit_tests/test_parallel_context.py::test_parallel_config
