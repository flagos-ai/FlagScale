# Enflame ZIXIAOC200 platform configuration.

device_types:
  - s60

s60:
  name: "s60"
  tests:
    functional:
      train:
        qwen3: ["0_6b_enflame"]
    unit:
      nproc_per_node: 1
      include: "*"
      exclude:
        - tests/unit_tests/test_parallel_context.py
        - tests/unit_tests/test_spiky_loss_detector.py
